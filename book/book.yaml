# Manifiesto canónico del libro — book-harness
#
# El harness razona sobre el libro a través de esta estructura, no tratando el repositorio como
# una colección arbitraria de Markdown (BOOK_HARNESS_BUILD_INSTRUCTIONS(1).md §4).
#
# `chapters` define el ORDEN canónico del libro. Ese orden es lo que usan los validadores para
# decidir si un capítulo referencia un contrato/componente "futuro" (introduced_in posterior en
# esta lista) — ver scripts/lib/registries.js.

book:
  id: como-construir-un-arnes
  version: "0.1"
  title: "¿Cómo construir un arnés?"
  language: es

chapters:
  - id: CH-00
    file: chapters/00-arquitectura-constitucion/chapter.md
  - id: CH-01
    file: chapters/01-agent-loop/chapter.md
  - id: CH-02
    file: chapters/02-tool-runtime/chapter.md
  - id: CH-03
    file: chapters/03-model-gateway/chapter.md
  - id: CH-04
    file: chapters/04-context-engine/chapter.md
  - id: CH-05
    file: chapters/05-policy-engine/chapter.md
  - id: CH-06
    file: chapters/06-human-interaction-service/chapter.md
  - id: CH-07
    file: chapters/07-execution-controller/chapter.md
  - id: CH-08
    file: chapters/08-capability-registry/chapter.md
  - id: CH-09
    file: chapters/09-event-bus/chapter.md
  - id: CH-10
    file: chapters/10-session-manager/chapter.md
  - id: CH-11
    file: chapters/11-agent-core/chapter.md
