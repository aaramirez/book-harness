# Component Registry — book-harness
#
# Fuente de verdad canónica de componentes de runtime introducidos a lo largo del libro.
# Esquema exigido por REGLAS_LIBRO_AGENT_HARNESS(1).md §11:
#
#   id:                       CMP-XXX (correlativo, nunca se reutiliza)
#   name:                     nombre canónico (PascalCase, en inglés)
#   responsibility:           responsabilidad primaria (una frase)
#   owns:                     lista de decisiones que este componente posee en exclusiva
#   does_not_own:             lista de responsabilidades explícitamente excluidas
#   dependencies:             lista de ComponentId de los que depende
#   consumes:                 lista de ContractId que recibe como entrada
#   produces:                 lista de ContractId que produce como salida
#   introduced_in:            ChapterId (debe existir en book/book.yaml)
#   constitutional_articles:  lista de ArticleId (P-xx / INV-xx) relevantes
#
# Regla: un componente solo puede aparecer aquí si el capítulo que lo introduce ya pasó
# `validate-chapter`. Ningún pseudocódigo puede invocar un componente cuyo `introduced_in` sea
# un capítulo posterior en `book/book.yaml` ("no magic entities", REGLAS_LIBRO §2).
#
# Historial: vacío hasta CH-00 (capítulo piloto, solo contratos — ver registry/contracts.yaml).
# CH-01 ("El Agent Loop y el Ciclo de Ejecución Cognitiva") introduce el primer componente real
# del libro, CMP-001 AgentLoop, con ficha literal contra constitution/ARCHITECTURE_CONSTITUTION.md
# Article III (sección "AgentLoop") y Article IV (Decision Ownership). Ver decisión de diseño en
# planes/2026-09-13-capitulo-01-agent-loop.md.
# CH-02 ("ToolRuntime y la Ejecución Controlada de una Tool Call") introduce el segundo, CMP-002
# ToolRuntime, con ficha literal contra Article III (sección "ToolRuntime") y Article IV. Ver
# decisión de diseño en planes/2026-09-13-capitulo-02-tool-runtime.md.
# CH-03 ("ModelGateway y la Invocación Real del Modelo") introduce el tercero, CMP-003
# ModelGateway, con ficha literal contra Article III (sección "ModelGateway") y Article IV. Ver
# decisión de diseño en planes/2026-09-13-capitulo-03-model-gateway.md.
# CH-04 ("ContextEngine y Qué Ve Realmente el Modelo") introduce el cuarto, CMP-004
# ContextEngine, con ficha literal contra Article III (sección "ContextEngine") y Article IV. Ver
# decisión de diseño en planes/2026-09-13-capitulo-04-context-engine.md.

components:
  - id: CMP-001
    name: AgentLoop
    responsibility: >
      Coordinar el turn lifecycle de una ejecución cognitiva (el ciclo model → action →
      observation), decidir si otro turno de razonamiento debe ocurrir y producir la transición
      de AgentRunStatus y el AgentEvent correspondientes — sin ejecutar directamente ningún side
      effect.
    owns:
      - turn lifecycle
      - "model → action → observation cycle (la decisión de continuar el ciclo, no su ejecución)"
      - continuation
      - completion
      - coordinación de la ejecución cognitiva
    does_not_own:
      - autorización
      - rendering
      - almacenamiento concreto
      - APIs específicas de proveedores
      - "operational continuation (budgets / cancelación / deadlines — Article IV asigna esta decisión a ExecutionController, preview, no introducido en este capítulo)"
      - "ejecución de una tool call aprobada (ToolRuntime, preview, no introducido en este capítulo)"
    dependencies: []
    consumes: [C-002, C-003, C-004, C-013]
    produces: [C-003, C-010, C-011, C-013]
    introduced_in: CH-01
    constitutional_articles: [P-10, P-12, P-13, INV-08, INV-09, INV-16, INV-17, INV-18, INV-19]

  - id: CMP-002
    name: ToolRuntime
    responsibility: >
      Resolver la capability solicitada por un ToolCall, validar su input contra el schema
      declarado, ejecutar los hooks de extensión (beforeToolCall/afterToolCall) y coordinar la
      ejecución de la acción aprobada, devolviendo un ToolResult normalizado — sin decidir
      autorización, aprobación humana, enforcement de presupuesto ni qué implementación concreta
      satisface la capability solicitada.
    owns:
      - "resolver tools/capabilities"
      - "validar llamadas"
      - "ejecutar hooks"
      - "coordinar ejecución"
      - "devolver resultados normalizados"
    does_not_own:
      - "policy evaluation y autorización de la acción (PolicyEngine, Article IV — no introducido en este capítulo)"
      - "aprobación humana (HumanInteractionService — no introducido en este capítulo)"
      - "enforcement de ExecutionBudget (ExecutionController — no introducido en este capítulo, mismo patrón ya establecido por AgentLoop en CH-01)"
      - "registro y resolución de qué implementación satisface una capability solicitada (CapabilityRegistry, Article III — no introducido en este capítulo, es un componente distinto)"
    dependencies: []
    consumes: [C-004, C-008]
    produces: [C-009, C-010, C-011]
    introduced_in: CH-02
    constitutional_articles: [P-03, P-04, P-05, P-12, P-13, INV-04, INV-05, INV-06, INV-07, INV-18, INV-19, INV-20]

  - id: CMP-003
    name: ModelGateway
    responsibility: >
      Seleccionar el provider de modelo correspondiente, adaptar los AgentMessage de un turno
      (más los límites de generación relevantes) hacia el ModelRequest que ese provider espera,
      invocar al modelo, soportar streaming y normalizar la respuesta cruda del provider hacia un
      ModelResponse — sin decidir si otro turno de razonamiento debe ocurrir, sin ejecutar ninguna
      tool call y sin resolver ninguna propuesta de acción hacia un ToolCall validado.
    owns:
      - "selección de provider"
      - "adaptación de mensajes"
      - "invocación del modelo"
      - "streaming"
      - "normalización de respuestas"
    does_not_own:
      - "decidir si otro turno de razonamiento debe ocurrir (AgentLoop, CMP-001, ya introducido en CH-01)"
      - "ejecutar tools/side effects (ToolRuntime, CMP-002, ya introducido en CH-02)"
      - "seleccionar/rankear/componer contexto (ContextEngine, Article III — no introducido en este capítulo, es un componente distinto)"
      - "policy/autorización de una acción (PolicyEngine, Article IV — no introducido en este capítulo)"
    dependencies: []
    consumes: [C-001, C-004, C-006]
    produces: [C-007, C-010, C-011]
    introduced_in: CH-03
    constitutional_articles: [P-01, P-02, P-10, P-12, P-13, INV-01, INV-02, INV-03, INV-18, INV-19, INV-20]

  - id: CMP-004
    name: ContextEngine
    responsibility: >
      Seleccionar, rankear, componer y compactar el material candidato de un turno (AgentMessage,
      AgentState, ExecutionContext) dentro de un presupuesto de contexto explícito, devolviendo un
      ContextSnapshot que registra la procedencia (provenance) de cada bloque incluido — sin
      invocar al modelo, sin decidir si otro turno debe ocurrir, sin persistir historial de sesión
      y sin autorizar qué información puede verse.
    owns:
      - "selección"
      - "ranking"
      - "composición"
      - "compaction"
      - "context budgets"
      - "provenance"
    does_not_own:
      - "invocar al modelo seleccionado (ModelGateway, CMP-003, ya introducido en CH-03)"
      - "decidir si otro turno de razonamiento debe ocurrir (AgentLoop, CMP-001, ya introducido en CH-01)"
      - "persistir/recuperar historial de sesión y checkpoints (SessionManager, Article IV — no introducido en este capítulo, es un componente distinto)"
      - "policy/autorización sobre qué información puede verse (PolicyEngine, Article IV — no introducido en este capítulo; distinto de seleccionar por relevancia, que sí le pertenece a ContextEngine)"
    dependencies: []
    consumes: [C-001, C-003, C-004]
    produces: [C-005, C-010, C-011]
    introduced_in: CH-04
    constitutional_articles: [P-01, P-04, P-12, P-14, INV-02, INV-09, INV-18, INV-19, INV-20]
