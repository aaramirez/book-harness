# Component Registry — book-harness
#
# Fuente de verdad canónica de componentes de runtime introducidos a lo largo del libro.
# Esquema exigido por REGLAS_LIBRO_AGENT_HARNESS(1).md §11:
#
#   id:                       CMP-XXX (correlativo, nunca se reutiliza)
#   name:                     nombre canónico (PascalCase, en inglés)
#   responsibility:           responsabilidad primaria (una frase)
#   owns:                     lista de decisiones que este componente posee en exclusiva
#   does_not_own:             lista de responsabilidades explícitamente excluidas
#   dependencies:             lista de ComponentId de los que depende
#   consumes:                 lista de ContractId que recibe como entrada
#   produces:                 lista de ContractId que produce como salida
#   introduced_in:            ChapterId (debe existir en book/book.yaml)
#   constitutional_articles:  lista de ArticleId (P-xx / INV-xx) relevantes
#
# Regla: un componente solo puede aparecer aquí si el capítulo que lo introduce ya pasó
# `validate-chapter`. Ningún pseudocódigo puede invocar un componente cuyo `introduced_in` sea
# un capítulo posterior en `book/book.yaml` ("no magic entities", REGLAS_LIBRO §2).
#
# Historial: vacío hasta CH-00 (capítulo piloto, solo contratos — ver registry/contracts.yaml).
# CH-01 ("El Agent Loop y el Ciclo de Ejecución Cognitiva") introduce el primer componente real
# del libro, CMP-001 AgentLoop, con ficha literal contra constitution/ARCHITECTURE_CONSTITUTION.md
# Article III (sección "AgentLoop") y Article IV (Decision Ownership). Ver decisión de diseño en
# planes/2026-09-13-capitulo-01-agent-loop.md.
# CH-02 ("ToolRuntime y la Ejecución Controlada de una Tool Call") introduce el segundo, CMP-002
# ToolRuntime, con ficha literal contra Article III (sección "ToolRuntime") y Article IV. Ver
# decisión de diseño en planes/2026-09-13-capitulo-02-tool-runtime.md.
# CH-03 ("ModelGateway y la Invocación Real del Modelo") introduce el tercero, CMP-003
# ModelGateway, con ficha literal contra Article III (sección "ModelGateway") y Article IV. Ver
# decisión de diseño en planes/2026-09-13-capitulo-03-model-gateway.md.
# CH-04 ("ContextEngine y Qué Ve Realmente el Modelo") introduce el cuarto, CMP-004
# ContextEngine, con ficha literal contra Article III (sección "ContextEngine") y Article IV. Ver
# decisión de diseño en planes/2026-09-13-capitulo-04-context-engine.md.
# CH-05 ("PolicyEngine y la Frontera de Autorización") introduce el quinto, CMP-005 PolicyEngine,
# con ficha literal contra Article III (sección "PolicyEngine") y Article IV. Ver decisión de
# diseño en planes/2026-09-14-capitulo-05-policy-engine.md.
# CH-06 ("HumanInteractionService y la Reanudación de una Ejecución Pausada") introduce el sexto,
# CMP-006 HumanInteractionService, con ficha literal contra Article III (sección
# "HumanInteractionService") y Article IV. Ver decisión de diseño en
# planes/2026-09-14-capitulo-06-human-interaction-service.md.
# CH-07 ("ExecutionController y los Límites Operacionales de una Ejecución") introduce el séptimo,
# CMP-007 ExecutionController, con ficha literal contra Article III (sección
# "ExecutionController") y Article IV, y le da, por primera vez, cumplimiento real a
# ExecutionBudget (C-012, CH-00). Ver decisión de diseño en
# planes/2026-09-14-capitulo-07-execution-controller.md.
# CH-08 ("CapabilityRegistry y la Resolución Real de una Tool Call") introduce el octavo, CMP-008
# CapabilityRegistry, con ficha literal contra Article III (sección "CapabilityRegistry") y
# Article IV, y produce, por primera vez con una resolución real (no una señal asumida), un
# ToolCall (C-008, CH-02) a partir de una RawToolCallProposal (embebida en ModelResponse, C-007,
# CH-03). Ver decisión de diseño en planes/2026-09-14-capitulo-08-capability-registry.md.
# CH-09 ("EventBus y la Distribución Desacoplada de un Evento Ya Producido") introduce el noveno,
# CMP-009 EventBus, con ficha literal contra Article III (sección "EventBus") — el primer
# componente real del libro sin fila propia en la tabla de Decision Ownership de Article IV, y el
# primero que no consume ExecutionContext. Distribuye (fan-out) cada AgentEvent (C-010, CH-00) ya
# producido por cualquier otro componente hacia las EventSubscription (C-019, el contrato nuevo)
# activas que hagan match por filtro. Ver decisión de diseño en
# planes/2026-09-14-capitulo-09-event-bus.md.
# CH-10 ("SessionManager y la Persistencia Durable de una Sesión") introduce el décimo, CMP-010
# SessionManager, con ficha literal contra Article III (sección "SessionManager") y Article IV —
# el componente más citado como deuda pendiente en CH-01/CH-02/CH-04/CH-06/CH-09 antes de este
# capítulo. Persiste, recupera, hace checkpoint y reconstruye la historia de una sesión a partir de
# un AgentState (C-003, CH-00) ya producido por AgentLoop, formalizando por primera vez el contrato
# SessionState (C-020) que P-08/INV-12 ya nombraban desde CH-00 sin definición registrada. De los
# once nombres de Article III, solo AgentCore sigue preview después de este capítulo. Ver decisión
# de diseño en planes/2026-09-14-capitulo-10-session-manager.md.
# CH-11 ("AgentCore y el Nacimiento de un AgentState") introduce el undécimo y último componente
# de Article III, CMP-011 AgentCore, con ficha literal contra Article III (sección "AgentCore") —
# el segundo componente real del libro sin fila propia en la tabla de Decision Ownership de
# Article IV (después de EventBus, CH-09), por una razón distinta: su decisión (validar y activar
# un agente) ocurre antes de que exista ningún AgentRun sobre el cual las preguntas de Article IV
# puedan aplicarse. Valida un AgentConfig (C-002, CH-00) ya registrado, instancia la primera
# instancia real de un AgentState (C-003, CH-00) de un nuevo run y ejercita, por primera vez con
# código real, la transición CREATED → INITIALIZING del diagrama de Article V. Ver decisión de
# diseño en planes/2026-09-14-capitulo-11-agent-core.md.
# CH-14 ("AdmissionController y la Admisión de una Activación Cruda") introduce el duodécimo
# componente, CMP-012 AdmissionController — el primero de este registry que NO corresponde a
# ninguno de los once nombres del árbol de Article III ("Agent Runtime"): pertenece al "Ingress &
# Activation Plane" de Amendment v1.1, con ficha literal contra ese Amendment (P-17: "AdmissionController
# MUST apply identity, authorization, tenant, capacity, rate, budget, deduplication and policy
# decisions before routing"). Evalúa un ActivationRequest (C-022, el estímulo externo ya
# normalizado, sin ningún agentId resuelto) y produce un AdmissionDecision (C-023, ADMIT/REJECT,
# nunca un Boolean) — sin resolver ni rutear hacia un AgentId concreto, sin construir el
# AgentState/AgentActivationRequest real de un agente (AgentCore, CMP-011, CH-11) y sin evaluar
# policy sobre una ToolCall ya en curso (PolicyEngine, CMP-005, CH-05). Ver decisión de diseño en
# planes/2026-09-14-capitulo-14-admission-controller.md.
# CH-15 ("AgentCommunicationGateway y la Frontera Explícita entre Agentes") introduce el
# decimotercer componente, CMP-013 AgentCommunicationGateway — el segundo de este registry que NO
# corresponde a ninguno de los once nombres de Article III: pertenece al "Agent Interoperability
# Plane" de Amendment v1.1 (el tercer plano canónico, segundo que este libro cubre), con ficha
# literal contra P-18/P-19/P-21. Adapta mensajes semánticos (AgentCommunicationMessage, C-024,
# boundary INTERNAL/EXTERNAL) hacia/desde protocolos de interoperabilidad externos exclusivamente
# vía adapters, desacopla el core de cualquier SDK/protocolo/transporte concreto, y verifica — sin
# redefinirlo — el límite de ExecutionBudget que un DelegationGrant (C-025) ya declara para una
# comunicación delegada (INV-E06) — sin decidir si un estímulo crudo tiene derecho a arrancar un run
# (AdmissionController, CMP-012, CH-14), sin autorizar una acción ya resuelta (PolicyEngine,
# CMP-005, CH-05) y sin decidir continuación de turno (AgentLoop, CMP-001, CH-01). Ver decisión de
# diseño en planes/2026-09-14-capitulo-15-agent-communication-gateway.md.
# CH-16 ("CredentialBroker y la Resolución Segura de una Credencial") introduce el decimocuarto
# componente, CMP-014 CredentialBroker — el tercero de este registry que NO corresponde a ninguno
# de los once nombres de Article III: pertenece al "Capability & Integration Plane" de Amendment
# v1.1 (el cuarto plano canónico, tercero que este libro cubre), con ficha literal contra
# INV-E08/INV-E07/P-22. Resuelve, para una implementación de capability ya resuelta
# (CapabilityDescriptor, C-018, CH-08), la credencial que necesita para autenticarse contra el
# sistema externo real que envuelve, produciendo exclusivamente una CredentialReference (C-026)
# opaca — nunca el valor real del secreto (INV-E08) — y aplicando sobre ese secreto clasificación y
# rotación/expiración explícitas (P-22) — sin decidir si la acción ya resuelta está autorizada
# (PolicyEngine, CMP-005, CH-05), sin resolver qué implementación satisface la capability
# (CapabilityRegistry, CMP-008, CH-08) y sin ejecutar el side effect en sí (ToolRuntime, CMP-002,
# CH-02). Ver decisión de diseño en planes/2026-09-14-capitulo-16-credential-broker.md.
# CH-17 ("IdempotencyGuard y la Deduplicación de un Side Effect Crítico") introduce el
# decimoquinto componente, CMP-015 IdempotencyGuard — el cuarto de este registry que NO
# corresponde a ninguno de los once nombres de Article III: pertenece al "Reliability Plane" de
# Amendment v1.1 (el séptimo plano canónico, cuarto que este libro cubre), con ficha literal
# contra INV-11 (Article II original — declarado desde CH-00, nunca antes resuelto por ningún
# componente) y P-24/INV-E09 (Amendment v1.1). A diferencia de CredentialBroker/
# AdmissionController/AgentCommunicationGateway, ningún texto de la Constitution nombra
# literalmente este componente — "IdempotencyGuard" es una síntesis de este libro, evaluada y
# documentada como tal. Rastrea, para un ToolCall (C-008, CH-02) con side effects identificado por
# una idempotencyKey ya asumida como dada, si esa ejecución ya ocurrió antes, permitiendo reusar el
# ToolResult (C-009) ya producido en vez de duplicar el side effect real, y registra de forma
# terminal y write-once una ejecución nueva ya concluida (IdempotencyRecord, C-027) — sin ejecutar
# el side effect en sí (ToolRuntime, CMP-002, CH-02), sin decidir autorización (PolicyEngine,
# CMP-005, CH-05), sin resolver qué implementación satisface la capability (CapabilityRegistry,
# CMP-008, CH-08) y sin decidir si un run puede reintentar contra su presupuesto
# (ExecutionController, CMP-007, CH-07 — distinción central del capítulo). Ver decisión de diseño
# en planes/2026-09-17-capitulo-17-idempotency-guard.md.
# CH-18 ("OperationalController y los Kill Switches Independientes de AgentLoop") introduce el
# decimosexto componente, CMP-016 OperationalController — el quinto de este registry que NO
# corresponde a ninguno de los once nombres de Article III: pertenece al "Control Plane" de
# Amendment v1.1 (el sexto plano canónico, quinto que este libro cubre), con ficha literal contra
# P-30 ("Operational control can override autonomy") e INV-E14 ("Kill switches operate
# independently of AgentLoop"). A diferencia de CredentialBroker/AdmissionController/
# AgentCommunicationGateway, y de la misma forma que IdempotencyGuard, ningún texto de la
# Constitution nombra literalmente este componente — "OperationalController" es una síntesis de
# este libro, evaluada y documentada como tal. Emite y aplica un ControlDirective (C-028) que
# deshabilita una capability, aísla los runs de un tenant, revierte un rollout o fuerza, mediante
# un kill switch, la terminación inmediata de un AgentRun — actuando siempre desde AFUERA del ciclo
# de cualquier run particular, sin depender de la cooperación del modelo ni de AgentLoop — sin
# decidir si UN run específico puede seguir operacionalmente contra su propio ExecutionBudget,
# evaluado desde DENTRO de su propio ciclo (ExecutionController, CMP-007, CH-07 — distinción
# central del capítulo), sin autorizar ninguna acción ya resuelta (PolicyEngine, CMP-005, CH-05),
# sin resolver qué implementación satisface una capability (CapabilityRegistry, CMP-008, CH-08) y
# sin ejecutar el side effect en sí (ToolRuntime, CMP-002, CH-02). Es, además, el primer componente
# de este libro cuyo pseudocódigo escribe, de verdad, una transición de AgentRunStatus (C-013)
# hacia CANCELLED sin invocar AgentLoop.runTurn (CH-01) ni ExecutionController.
# evaluateExecutionContinuation (CH-07) — la materialización literal de INV-E14. Ver decisión de
# diseño en planes/2026-09-17-capitulo-18-operational-controller.md.

components:
  - id: CMP-001
    name: AgentLoop
    responsibility: >
      Coordinar el turn lifecycle de una ejecución cognitiva (el ciclo model → action →
      observation), decidir si otro turno de razonamiento debe ocurrir y producir la transición
      de AgentRunStatus y el AgentEvent correspondientes — sin ejecutar directamente ningún side
      effect.
    owns:
      - turn lifecycle
      - "model → action → observation cycle (la decisión de continuar el ciclo, no su ejecución)"
      - continuation
      - completion
      - coordinación de la ejecución cognitiva
    does_not_own:
      - autorización
      - rendering
      - almacenamiento concreto
      - APIs específicas de proveedores
      - "operational continuation (budgets / cancelación / deadlines — Article IV asigna esta decisión a ExecutionController, preview, no introducido en este capítulo)"
      - "ejecución de una tool call aprobada (ToolRuntime, preview, no introducido en este capítulo)"
    dependencies: []
    consumes: [C-002, C-003, C-004, C-013]
    produces: [C-003, C-010, C-011, C-013]
    introduced_in: CH-01
    constitutional_articles: [P-10, P-12, P-13, INV-08, INV-09, INV-16, INV-17, INV-18, INV-19]

  - id: CMP-002
    name: ToolRuntime
    responsibility: >
      Resolver la capability solicitada por un ToolCall, validar su input contra el schema
      declarado, ejecutar los hooks de extensión (beforeToolCall/afterToolCall) y coordinar la
      ejecución de la acción aprobada, devolviendo un ToolResult normalizado — sin decidir
      autorización, aprobación humana, enforcement de presupuesto ni qué implementación concreta
      satisface la capability solicitada.
    owns:
      - "resolver tools/capabilities"
      - "validar llamadas"
      - "ejecutar hooks"
      - "coordinar ejecución"
      - "devolver resultados normalizados"
    does_not_own:
      - "policy evaluation y autorización de la acción (PolicyEngine, Article IV — no introducido en este capítulo)"
      - "aprobación humana (HumanInteractionService — no introducido en este capítulo)"
      - "enforcement de ExecutionBudget (ExecutionController — no introducido en este capítulo, mismo patrón ya establecido por AgentLoop en CH-01)"
      - "registro y resolución de qué implementación satisface una capability solicitada (CapabilityRegistry, Article III — no introducido en este capítulo, es un componente distinto)"
    dependencies: []
    consumes: [C-004, C-008]
    produces: [C-009, C-010, C-011]
    introduced_in: CH-02
    constitutional_articles: [P-03, P-04, P-05, P-12, P-13, INV-04, INV-05, INV-06, INV-07, INV-18, INV-19, INV-20]

  - id: CMP-003
    name: ModelGateway
    responsibility: >
      Seleccionar el provider de modelo correspondiente, adaptar los AgentMessage de un turno
      (más los límites de generación relevantes) hacia el ModelRequest que ese provider espera,
      invocar al modelo, soportar streaming y normalizar la respuesta cruda del provider hacia un
      ModelResponse — sin decidir si otro turno de razonamiento debe ocurrir, sin ejecutar ninguna
      tool call y sin resolver ninguna propuesta de acción hacia un ToolCall validado.
    owns:
      - "selección de provider"
      - "adaptación de mensajes"
      - "invocación del modelo"
      - "streaming"
      - "normalización de respuestas"
    does_not_own:
      - "decidir si otro turno de razonamiento debe ocurrir (AgentLoop, CMP-001, ya introducido en CH-01)"
      - "ejecutar tools/side effects (ToolRuntime, CMP-002, ya introducido en CH-02)"
      - "seleccionar/rankear/componer contexto (ContextEngine, Article III — no introducido en este capítulo, es un componente distinto)"
      - "policy/autorización de una acción (PolicyEngine, Article IV — no introducido en este capítulo)"
    dependencies: []
    consumes: [C-001, C-004, C-006]
    produces: [C-007, C-010, C-011]
    introduced_in: CH-03
    constitutional_articles: [P-01, P-02, P-10, P-12, P-13, INV-01, INV-02, INV-03, INV-18, INV-19, INV-20]

  - id: CMP-004
    name: ContextEngine
    responsibility: >
      Seleccionar, rankear, componer y compactar el material candidato de un turno (AgentMessage,
      AgentState, ExecutionContext) dentro de un presupuesto de contexto explícito, devolviendo un
      ContextSnapshot que registra la procedencia (provenance) de cada bloque incluido — sin
      invocar al modelo, sin decidir si otro turno debe ocurrir, sin persistir historial de sesión
      y sin autorizar qué información puede verse.
    owns:
      - "selección"
      - "ranking"
      - "composición"
      - "compaction"
      - "context budgets"
      - "provenance"
    does_not_own:
      - "invocar al modelo seleccionado (ModelGateway, CMP-003, ya introducido en CH-03)"
      - "decidir si otro turno de razonamiento debe ocurrir (AgentLoop, CMP-001, ya introducido en CH-01)"
      - "persistir/recuperar historial de sesión y checkpoints (SessionManager, Article IV — no introducido en este capítulo, es un componente distinto)"
      - "policy/autorización sobre qué información puede verse (PolicyEngine, Article IV — no introducido en este capítulo; distinto de seleccionar por relevancia, que sí le pertenece a ContextEngine)"
    dependencies: []
    consumes: [C-001, C-003, C-004]
    produces: [C-005, C-010, C-011]
    introduced_in: CH-04
    constitutional_articles: [P-01, P-04, P-12, P-14, INV-02, INV-09, INV-18, INV-19, INV-20]

  - id: CMP-005
    name: PolicyEngine
    responsibility: >
      Evaluar si una acción ya resuelta (ToolCall) puede ocurrir, produciendo una PolicyDecision
      determinística de tres resultados posibles (allow, deny, require_approval) — con la regla
      aplicable y el ToolCall evaluado siempre trazables — sin ejecutar la acción, sin invocar al
      modelo, sin seleccionar contexto, sin decidir continuación del turno y sin resolver ella
      misma la aprobación humana cuando la exige.
    owns:
      - "allow"
      - "deny"
      - "constraints"
      - "approval requirements"
      - "policy evaluation"
    does_not_own:
      - "ejecutar la acción ya evaluada (ToolRuntime, CMP-002, ya introducido en CH-02 — Article IV: \"ToolRuntime → How should an approved action be executed?\")"
      - "invocar al modelo seleccionado (ModelGateway, CMP-003, ya introducido en CH-03)"
      - "seleccionar/rankear/componer contexto (ContextEngine, CMP-004, ya introducido en CH-04)"
      - "decidir si otro turno de razonamiento debe ocurrir (AgentLoop, CMP-001, ya introducido en CH-01)"
      - "representar, persistir y resolver la aprobación humana cuando outcome = REQUIRE_APPROVAL (HumanInteractionService, Article III — no introducido en este capítulo; INV-15 exige que la acción no se ejecute antes de una resolución válida, pero resolver esa aprobación no es trabajo de PolicyEngine)"
      - "enforcement de ExecutionBudget (ExecutionController, Article III — no introducido en este capítulo)"
    dependencies: []
    consumes: [C-004, C-008]
    produces: [C-010, C-011, C-014]
    introduced_in: CH-05
    constitutional_articles: [P-05, P-13, INV-04, INV-06, INV-15, INV-18, INV-19, INV-20]

  - id: CMP-006
    name: HumanInteractionService
    responsibility: >
      Representar una solicitud de intervención humana a partir de una PolicyDecision con
      outcome = REQUIRE_APPROVAL, persistirla mientras está pendiente, recibir su resolución y
      dejar disponible la información que permitiría reanudar la ejecución — sin decidir si esa
      aprobación se requiere, sin transportar la interacción por ningún canal concreto, sin
      ejecutar la acción una vez resuelta y sin decidir si el turno debe continuar.
    owns:
      - "representar solicitudes humanas"
      - "persistir interacciones pendientes"
      - "recibir resoluciones"
      - "permitir reanudación"
    does_not_own:
      - "decidir SI una acción requiere aprobación humana (PolicyEngine, CMP-005, ya introducido en CH-05 — esa decisión ya se tomó cuando PolicyDecision.outcome = REQUIRE_APPROVAL; este componente solo recibe esa señal)"
      - "transportar la interacción a través de un canal concreto — TUI/Web/Slack/Teams/Mobile/Email/API (Channel Adapter, Article VIII/P-11 — concepto de infraestructura de borde, no un componente propio de Article III / del registry)"
      - "ejecutar la acción una vez resuelta (ToolRuntime, CMP-002, ya introducido en CH-02 — Article IV: \"ToolRuntime → How should an approved action be executed?\")"
      - "decidir si otro turno de razonamiento debe ocurrir o si la ejecución debe reanudarse operacionalmente (AgentLoop, CMP-001, ya introducido en CH-01)"
    dependencies: []
    consumes: [C-004, C-014]
    produces: [C-010, C-011, C-015, C-016]
    introduced_in: CH-06
    constitutional_articles: [P-11, INV-14, INV-15, INV-18, INV-19, INV-20]

  - id: CMP-007
    name: ExecutionController
    responsibility: >
      Evaluar si un AgentRun puede continuar operacionalmente contra su ExecutionBudget —
      turnos, tool calls, tokens, costo, runtime y concurrencia — o si fue cancelado
      explícitamente, produciendo una ExecutionDecision determinística de tres resultados
      posibles (continue/stop/cancelled) con el uso actual siempre trazable — sin decidir si
      otro turno de razonamiento cognitivo debe ocurrir, sin ejecutar tools/side effects, sin
      evaluar policy/autorización y sin invocar al modelo.
    owns:
      - "budgets"
      - "cancellation"
      - "deadlines"
      - "runtime limits"
      - "operational continuation"
    does_not_own:
      - "decidir si otro turno de razonamiento cognitivo debe ocurrir (AgentLoop, CMP-001, ya introducido en CH-01 — Article IV: \"AgentLoop → Should another reasoning turn occur?\"; distinción constitucional literal: ExecutionController decide si la ejecución PUEDE continuar operacionalmente frente a sus límites, AgentLoop decide si DEBE continuar cognitivamente — ninguna de las dos preguntas sustituye a la otra)"
      - "ejecutar tools/side effects (ToolRuntime, CMP-002, ya introducido en CH-02)"
      - "evaluar policy/autorización de una acción (PolicyEngine, CMP-005, ya introducido en CH-05)"
      - "invocar al modelo seleccionado (ModelGateway, CMP-003, ya introducido en CH-03)"
    dependencies: []
    consumes: [C-003, C-004, C-012]
    produces: [C-010, C-011, C-017]
    introduced_in: CH-07
    constitutional_articles: [P-10, INV-08, INV-09, INV-10, INV-18, INV-19, INV-20]

  - id: CMP-008
    name: CapabilityRegistry
    responsibility: >
      Registrar las capabilities disponibles junto con su descriptor (nombre canónico, versión,
      schema de entrada esperado y una referencia opaca a su implementación concreta), resolver el
      capabilityName de una RawToolCallProposal contra ese registro, validar sus rawArguments
      contra el schema declarado y producir un ToolCall resuelto — sin ejecutar la capability, sin
      invocar al modelo ni interpretar su propuesta cruda, sin evaluar policy/autorización y sin
      decidir continuación de turno.
    owns:
      - "registrar el descriptor de una capability disponible (nombre, versión, schema de entrada, referencia de implementación)"
      - "resolver qué implementación satisface una capability solicitada"
      - "validar los argumentos crudos de una propuesta contra el schema declarado por la capability resuelta"
      - "desacoplar la intención de una capacidad de su implementación concreta"
    does_not_own:
      - "ejecutar la capability ya resuelta (ToolRuntime, CMP-002, ya introducido en CH-02 — Article IV: \"ToolRuntime → How should an approved action be executed?\")"
      - "invocar al modelo seleccionado o interpretar su propuesta cruda antes de que llegue como ModelResponse (ModelGateway, CMP-003, ya introducido en CH-03 — Article IV: \"ModelGateway → How should the selected model be invoked?\")"
      - "evaluar policy/autorización sobre si la acción ya resuelta debe ejecutarse (PolicyEngine, CMP-005, ya introducido en CH-05 — distinción cuidadosa: \"¿existe e implementa correctamente esta capability?\" es de CapabilityRegistry, \"¿está permitido usarla ahora?\" es de PolicyEngine)"
      - "decidir si otro turno de razonamiento debe ocurrir (AgentLoop, CMP-001, ya introducido en CH-01)"
    dependencies: []
    consumes: [C-004, C-007]
    produces: [C-008, C-010, C-011, C-018]
    introduced_in: CH-08
    constitutional_articles: [P-03, P-13, P-26, INV-03, INV-04, INV-05, INV-18, INV-19, INV-20]

  - id: CMP-009
    name: EventBus
    responsibility: >
      Distribuir cada AgentEvent ya producido por cualquier otro componente del runtime hacia los
      consumidores desacoplados que se hayan suscrito — registrando cada suscripción activa y
      entregando (fan-out) el evento a las que hagan match por filtro — sin decidir qué información
      contiene ese evento, sin interpretar ni actuar sobre él, sin persistir historial de sesión de
      forma durable y sin decidir continuación de turno ni ninguna otra decisión arquitectónica.
    owns:
      - "registrar una suscripción de un consumidor desacoplado (subscriberRef opaco y un filtro opcional)"
      - "cancelar una suscripción ya registrada"
      - "distribuir (fan-out) cada AgentEvent ya producido por cualquier componente hacia las suscripciones activas que hagan match por filtro"
      - "desacoplar al productor de un AgentEvent de sus consumidores (cita literal de Article III)"
    does_not_own:
      - "decidir qué información va dentro de un AgentEvent (cada componente productor ya lo decide al construir su propio AgentEvent — CMP-001..CMP-008, ya introducidos)"
      - "interpretar o actuar sobre un AgentEvent distribuido (Logs/Tracing/Audit/Replay/Analytics/Evals/Cost Analysis/Debugging/UI, Article X — ninguno es un componente propio de este registry todavía)"
      - "persistir historial de sesión de forma durable para reconstrucción posterior (SessionManager, Article III — no introducido, preview)"
      - "decidir continuación de turno o cualquier otra decisión arquitectónica (AgentLoop/PolicyEngine/ExecutionController, ya introducidos)"
    dependencies: []
    consumes: [C-010]
    produces: [C-011, C-019]
    introduced_in: CH-09
    constitutional_articles: [P-04, P-11, P-12, P-25, INV-18, INV-19, INV-20]

  - id: CMP-010
    name: SessionManager
    responsibility: >
      Persistir y actualizar la historia de una sesión mediante checkpoints construidos a partir de
      un AgentState ya producido por una ejecución existente, reconstruir un SessionState completo
      desde un checkpoint ya persistido, y crear una rama nueva de sesión a partir de un checkpoint
      existente — sin poseer el estado operativo de la ejecución en curso, sin persistir las
      solicitudes de interacción humana que HumanInteractionService ya persiste por su cuenta, sin
      decidir continuación de turno y sin distribuir eventos.
    owns:
      - "persistencia"
      - "recuperación"
      - "branching"
      - "checkpoints"
      - "reconstrucción"
    does_not_own:
      - "el estado operativo de una ejecución en curso (AgentState, C-003, ya existente — producido y poseído en exclusiva por AgentLoop, CMP-001, ya introducido en CH-01; P-08/INV-12 exigen que ambos permanezcan conceptualmente independientes: SessionManager solo persiste una COPIA inmutable de un AgentState ya producido, nunca lo posee ni lo trata como fuente de verdad de la ejecución activa)"
      - "persistir sus propias solicitudes de interacción humana pendientes (HumanInteractionService, CMP-006, ya introducido en CH-06 — ya tiene esa responsabilidad acotada y propia; SessionManager no la absorbe ni la duplica)"
      - "decidir si otro turno de razonamiento debe ocurrir (AgentLoop, CMP-001, ya introducido en CH-01)"
      - "distribuir eventos del runtime a consumidores desacoplados (EventBus, CMP-009, ya introducido en CH-09 — aunque SessionManager podría, en un capítulo futuro, suscribirse como un consumidor más de EventBus para reconstruir historial a partir de eventos ya distribuidos)"
    dependencies: []
    consumes: [C-003, C-004]
    produces: [C-010, C-011, C-020]
    introduced_in: CH-10
    constitutional_articles: [P-04, P-08, P-23, INV-12, INV-13, INV-18, INV-19, INV-20]

  - id: CMP-011
    name: AgentCore
    responsibility: >
      Representar la identidad de un agente — independiente de cualquier run o sesión particular
      —, validar su AgentConfig antes de que arranque cualquier ejecución, e instanciar el
      AgentState inicial de un nuevo run: asignar su runId, decidir su sessionId y producir la
      primera transición formal de Article V (CREATED → INITIALIZING) — sin decidir nada de lo que
      ocurre una vez que ese run ya está RUNNING.
    owns:
      - "representar y coordinar las primitives fundamentales del agente"
      - "representar la identidad/definición del agente, independiente de cualquier run o sesión particular"
      - "validar un AgentConfig antes de que arranque cualquier ejecución"
      - "instanciar el AgentState inicial de un nuevo run (asignar runId, decidir sessionId)"
      - "la transición CREATED → INITIALIZING (Article V)"
    does_not_own:
      - "UI (cita literal Article III — INV-16)"
      - "persistencia específica (cita literal Article III — SessionManager, CMP-010, ya introducido en CH-10, posee la persistencia durable de la historia de una sesión)"
      - "proveedores (cita literal Article III — ModelGateway, CMP-003, ya introducido en CH-03, posee selección/invocación de provider — INV-01)"
      - "business integrations (cita literal Article III — sin componente propio todavía en este registry; fuera de alcance genérico de BH-v0.1)"
      - "decidir si otro turno de razonamiento debe ocurrir una vez que el run ya está RUNNING (AgentLoop, CMP-001, ya introducido en CH-01 — AgentCore entrega el testigo a AgentLoop después de INITIALIZING, nunca compite con él)"
    dependencies: []
    consumes: [C-002, C-012, C-021]
    produces: [C-003, C-004, C-010, C-011]
    introduced_in: CH-11
    constitutional_articles: [P-06, P-10, P-12, INV-01, INV-08, INV-09, INV-16, INV-18, INV-19, INV-20]

  - id: CMP-012
    name: AdmissionController
    responsibility: >
      Aplicar identity, authorization, tenant, capacity, rate, budget, deduplication y policy
      decisions sobre un ActivationRequest ya normalizado, antes de que cualquier ruteo hacia un
      agente concreto sea siquiera posible — produciendo un AdmissionDecision determinístico de
      dos resultados posibles (ADMIT/REJECT, nunca un Boolean) — sin decidir a qué agente concreto
      corresponde la activación, sin construir ningún AgentState y sin evaluar policy sobre
      ninguna acción ya resuelta.
    owns:
      - "apply identity, authorization, tenant, capacity, rate, budget, deduplication and policy decisions before routing (cita literal, Amendment v1.1, P-17)"
      - "decidir, con un outcome de dos valores (ADMIT/REJECT), si un ActivationRequest ya normalizado puede proceder"
      - "rechazar por defecto (fail-closed) cuando ninguna regla de admisión concede acceso (Default Reject)"
      - "correlacionar cada AdmissionDecision de vuelta con el ActivationRequest que la motivó (requestId)"
    does_not_own:
      - "normalizar el estímulo externo crudo en un ActivationRequest (Ingress Adapter — infraestructura de borde, Amendment v1.1 P-16, no un componente propio de este registry)"
      - "resolver o rutear una activación admitida hacia un AgentId/AgentConfig concreto (Routing, Amendment v1.1 — P-17 la coloca explícitamente \"before routing\"; sin componente propio todavía en este registry)"
      - "construir el AgentState/AgentActivationRequest real de un agente concreto (AgentCore, CMP-011, ya introducido en CH-11 — AdmissionController decide SI se puede proceder, AgentCore decide CÓMO nace el run)"
      - "evaluar policy sobre una ToolCall ya en curso (PolicyEngine, CMP-005, ya introducido en CH-05 — distinto momento, distinta pregunta: \"¿puede esta activación empezar?\" vs. \"¿puede esta acción ejecutarse?\")"
    dependencies: []
    consumes: [C-022]
    produces: [C-011, C-023]
    introduced_in: CH-14
    constitutional_articles: [P-16, P-17, P-25, INV-E01, INV-E02, INV-18, INV-19, INV-20]

  - id: CMP-013
    name: AgentCommunicationGateway
    responsibility: >
      Adaptar mensajes semánticos hacia/desde protocolos de interoperabilidad externos (A2A u
      otros) exclusivamente a través de adapters, desacoplando el core de cualquier SDK, protocolo
      o transporte concreto — y verificar, sin redefinirlo, que una comunicación respaldada por un
      DelegationGrant respete el scope, el vencimiento y el ExecutionBudget acotado que ese grant ya
      declara — sin decidir si el estímulo que originó cualquiera de los dos runs comunicándose
      tenía derecho a arrancar, sin autorizar ninguna acción ya resuelta y sin decidir continuación
      de turno.
    owns:
      - "Agent communication MUST use explicit semantic contracts. Protocols define interoperability; transports define delivery. Neither belongs inside Agent Core (cita literal, P-18)"
      - "A2A or future interoperability standards MUST be integrated through AgentCommunicationGateway adapters. The core MUST NOT depend directly on an A2A SDK or a particular wire protocol (cita literal, P-19)"
      - "distinguir siempre delegación interna de federación externa (boundary, P-20)"
      - "verificar — nunca redefinir — que un DelegationGrant que respalda un mensaje siga vigente, cubra lo que el mensaje pide (scope) y respete el ExecutionBudget acotado que declara (INV-E06)"
      - "rechazar por defecto (fail-closed) cuando un DelegationGrant declarado no se encuentra, no corresponde, expiró o no cubre el mensaje"
    does_not_own:
      - "decidir si el estímulo externo crudo que originó cualquiera de los dos runs comunicándose tenía siquiera derecho a arrancar (AdmissionController, CMP-012, ya introducido en CH-14 — pregunta anterior, sobre un ActivationRequest todavía sin agentId resuelto)"
      - "autorizar una acción/tool call ya resuelta dentro de un run (PolicyEngine, CMP-005, ya introducido en CH-05 — distinto momento, distinta pregunta: \"¿puede este mensaje cruzar hacia otro agente?\" vs. \"¿puede esta acción ejecutarse dentro de este run?\")"
      - "decidir si otro turno de razonamiento debe ocurrir (AgentLoop, CMP-001, ya introducido en CH-01)"
      - "el protocolo de wire o el transporte concreto en sí — HTTP, gRPC, WebSocket, un SDK de A2A (Protocol Adapter / Transport Adapter, INV-E04, no un componente propio de este registry)"
      - "revalidar la coherencia interna del ExecutionBudget embebido en un DelegationGrant (AgentCore, CMP-011, ya introducido en CH-11 — isExecutionBudgetCoherent ya existe ahí)"
    dependencies: []
    consumes: [C-024, C-025]
    produces: [C-011, C-024]
    introduced_in: CH-15
    constitutional_articles: [P-18, P-19, P-20, P-21, P-25, INV-E03, INV-E04, INV-E05, INV-E06, INV-18, INV-19, INV-20]

  - id: CMP-014
    name: CredentialBroker
    responsibility: >
      Resolver, para una implementación de capability ya resuelta (CapabilityDescriptor, C-018,
      CH-08), la credencial que necesita para autenticarse contra el sistema externo real que
      envuelve — produciendo exclusivamente una CredentialReference opaca, nunca el valor real del
      secreto — y aplicar sobre ese secreto el gobierno de datos que P-22 exige (clasificación,
      rotación/expiración), sin decidir si la acción que esa implementación va a ejecutar está
      autorizada, sin decidir qué implementación satisface la capability solicitada y sin ejecutar
      el side effect en sí.
    owns:
      - "Credentials are resolved by a CredentialBroker and SHOULD NOT enter model context (cita literal, INV-E08)"
      - "Tenant data, memory, credentials, artifacts and audit records are isolated (cita literal, INV-E07, aplicada específicamente a credenciales)"
      - "aplicar sobre un secreto el gobierno de datos que P-22 exige — clasificación explícita (CredentialReference.classification) y rotación/expiración explícitas (CredentialReference.expiresAt) — cuando ese secreto las declara"
      - "verificar que el secreto solicitado corresponda a la capability ya resuelta, exista y no haya vencido, antes de producir cualquier CredentialReference"
      - "rechazar por defecto (fail-closed) cuando el secreto no corresponde, no existe o ya venció"
      - "garantizar, por construcción del propio contrato, que el valor real del secreto nunca aparezca en ningún dato que este componente produce"
    does_not_own:
      - "decidir si la acción/ToolCall ya resuelta que la implementación va a ejecutar está autorizada (PolicyEngine, CMP-005, ya introducido en CH-05 — distinta pregunta, distinto momento: \"con qué se autentica\" nunca es \"si está permitido\")"
      - "resolver qué implementación satisface una capability solicitada (CapabilityRegistry, CMP-008, ya introducido en CH-08 — este componente actúa DESPUÉS, sobre un CapabilityDescriptor ya resuelto)"
      - "ejecutar el side effect en sí, incluyendo la autenticación real contra el sistema externo con la credencial ya resuelta (ToolRuntime, CMP-002, ya introducido en CH-02 — el cableado real es trabajo de un capítulo de integración futuro)"
      - "el mecanismo real de almacenamiento, cifrado o rotación física del secreto (Secret Store — infraestructura de borde, no un componente propio de este registry)"
      - "decidir si otro turno de razonamiento debe ocurrir (AgentLoop, CMP-001, ya introducido en CH-01)"
    dependencies: []
    consumes: [C-004, C-018]
    produces: [C-010, C-011, C-026]
    introduced_in: CH-16
    constitutional_articles: [P-13, P-22, INV-E07, INV-E08, INV-18, INV-19, INV-20]

  - id: CMP-015
    name: IdempotencyGuard
    responsibility: >
      Rastrear, para un ToolCall con side effects (C-008, CH-02) identificado por una clave de
      idempotencia ya asumida como dada, si esa ejecución ya ocurrió antes bajo esa misma clave —
      permitiendo, cuando corresponda, reusar el ToolResult (C-009, CH-02) ya producido en vez de
      duplicar el side effect real — y registrar, una vez que una ejecución nueva concluye, el
      IdempotencyRecord terminal correspondiente, sin sobrescribir jamás uno ya producido — sin
      ejecutar el side effect en sí, sin decidir autorización, sin resolver qué implementación
      satisface la capability y sin decidir si un run puede reintentar contra su presupuesto.
    owns:
      - "Side effects críticos deben soportar idempotencia, deduplicación o una protección equivalente (cita literal, INV-11, Article II — Execution Invariants)"
      - "Capabilities with externally visible side effects MUST declare idempotency, retry and duplicate-delivery behavior (cita literal, P-24)"
      - "Every side-effecting capability declares idempotency and retry semantics (cita literal, INV-E09 — la mitad de \"idempotency\"; la mitad de \"retry\" pertenece a ExecutionController)"
      - "detectar cuándo un ToolCall ya se ejecutó antes bajo la misma clave de idempotencia, produciendo el IdempotencyRecord ya asociado a esa clave (PENDING o COMPLETED), cuando existe"
      - "decidir si una ejecución repetida debe reusar el ToolResult ya conocido, en vez de que el side effect real vuelva a ejecutarse"
      - "registrar, de forma terminal y write-once, el IdempotencyRecord COMPLETED que resulta de una ejecución nueva ya concluida"
      - "rechazar por defecto (fail-closed) cuando la clave de idempotencia encontrada corresponde a una capability distinta de la solicitada, o cuando se intenta re-registrar una ejecución ya COMPLETED"
    does_not_own:
      - "ejecutar el side effect en sí (ToolRuntime, CMP-002, ya introducido en CH-02 — IdempotencyGuard decide SI debe ejecutarse de nuevo, nunca CÓMO se ejecuta)"
      - "decidir si la acción/ToolCall ya resuelta está autorizada (PolicyEngine, CMP-005, ya introducido en CH-05 — distinta pregunta, distinto momento: \"¿ya se hizo esto?\" nunca es \"¿está permitido hacerlo?\")"
      - "resolver qué implementación satisface una capability solicitada (CapabilityRegistry, CMP-008, ya introducido en CH-08)"
      - "decidir si un AgentRun puede seguir operacionalmente contra su ExecutionBudget, incluyendo si reintentar tras un fallo transitorio (ExecutionController, CMP-007, ya introducido en CH-07 — distinción central de este capítulo: \"puedo seguir intentando\" y \"ya se hizo con éxito\" son preguntas ortogonales sobre materiales distintos)"
      - "generar la clave de idempotencia misma, ni decidir con qué algoritmo se deriva (asumida como una señal de entrada dada)"
      - "el mecanismo real de persistencia atómica que evita una condición de carrera entre dos ejecuciones concurrentes que reclaman la misma clave al mismo tiempo (Preview, infraestructura de borde, no un componente propio de este registry)"
    dependencies: []
    consumes: [C-004, C-008, C-009]
    produces: [C-010, C-011, C-027]
    introduced_in: CH-17
    constitutional_articles: [P-13, P-24, INV-11, INV-E09, INV-18, INV-19, INV-20]

  - id: CMP-016
    name: OperationalController
    responsibility: >
      Emitir y aplicar un comando operacional (ControlDirective) que deshabilita una capability,
      aísla los runs de un tenant, revierte un rollout o fuerza, mediante un kill switch, la
      terminación inmediata de un AgentRun — actuando siempre desde AFUERA del ciclo de cualquier
      run particular y sin depender de la cooperación del modelo ni de AgentLoop — sin decidir si
      UN run específico puede seguir contra su propio presupuesto operacional, sin autorizar
      ninguna acción ya resuelta, sin resolver qué implementación satisface una capability y sin
      ejecutar el side effect en sí.
    owns:
      - "The platform MUST support cancellation, capability disablement, tenant isolation, rollout rollback and kill switches without relying on model cooperation (cita literal, P-30 — \"cancellation\" se provee aquí exclusivamente como KILL_SWITCH, la mitad externa; la mitad interna, evaluada desde dentro del ciclo de un run, sigue siendo de ExecutionController)"
      - "Kill switches operate independently of AgentLoop (cita literal, INV-E14)"
      - "emitir un ControlDirective (ISSUED) para cualquiera de los cuatro tipos, rechazando por defecto (fail-closed) uno sin referencia de alcance (targetRef)"
      - "forzar, para un ControlDirective de tipo KILL_SWITCH, la transición inmediata de un AgentState en un AgentRunStatus no terminal hacia CANCELLED, sin invocar evaluateExecutionContinuation (ExecutionController, CH-07) ni ningún turno de AgentLoop (CH-01)"
      - "registrar, de forma terminal y write-once, cuándo un ControlDirective ya se aplicó (APPLIED), rechazando reaplicar uno ya APPLIED"
      - "rechazar por defecto (fail-closed) un kill switch cuyo AgentRun objetivo ya alcanzó un AgentRunStatus terminal por cualquier otra vía — la regla explícita que resuelve el \"empate\" con ExecutionController"
    does_not_own:
      - "decidir si UN AgentRun específico puede seguir operacionalmente contra su ExecutionBudget, evaluado desde DENTRO del propio ciclo de esa ejecución (ExecutionController, CMP-007, ya introducido en CH-07 — distinción central de este capítulo: \"¿puedo seguir intentando, evaluado desde dentro de mi propio ciclo?\" nunca es \"¿debe el control externo forzar mi fin, desde afuera, sin pedir cooperación?\"; la mitad de \"cancellation\" evaluada por presupuesto sigue siendo, sin excepción, de ExecutionController)"
      - "decidir si una acción/ToolCall ya resuelta está autorizada (PolicyEngine, CMP-005, ya introducido en CH-05 — distinta pregunta, distinto momento: \"¿debe detenerse/deshabilitarse esto por control operacional?\" nunca es \"¿está permitido hacerlo?\")"
      - "resolver qué implementación satisface una capability solicitada (CapabilityRegistry, CMP-008, ya introducido en CH-08 — este componente decide SI una capability está deshabilitada, nunca CUÁL implementación la satisface)"
      - "ejecutar el side effect en sí (ToolRuntime, CMP-002, ya introducido en CH-02)"
      - "generar el targetRef mismo, ni decidir a qué capability/tenant/rollout/run corresponde en el mundo real más allá de la referencia opaca ya provista (asumida como una señal de entrada dada)"
      - "el mecanismo real y distribuido que efectivamente impide invocar una capability deshabilitada, bloquea físicamente los runs de un tenant aislado, o redespliega una versión anterior de un rollout (Preview, infraestructura de borde, no un componente propio de este registry)"
    dependencies: []
    consumes: [C-003, C-004]
    produces: [C-010, C-011, C-028]
    introduced_in: CH-18
    constitutional_articles: [P-13, P-30, INV-08, INV-18, INV-19, INV-20, INV-E14]

  - id: CMP-017
    name: AuditLedger
    responsibility: >
      Producir y preservar, de forma estructuralmente inmutable (append-only, nunca editada ni
      borrada una vez escrita), evidencia de auditoría para una decisión crítica ya tomada por
      otro componente — capturando una referencia opaca a esa decisión, el snapshot exacto de
      versiones de agente/skill/policy/configuración de modelo/capability vigente en ese instante
      (INV-E10) y el actor/contexto que INV-19 exige — sin tomar ni modificar la decisión que
      audita, sin distribuir el flujo general de eventos operacionales del harness y sin autorizar
      el acceso de lectura al propio ledger.
    owns:
      - "Logs, traces, execution ledger and immutable audit evidence have different purposes and MUST NOT be conflated (cita literal, P-25) — producir, en exclusiva, el subconjunto de evidencia estructuralmente inmutable que ese principio distingue de la telemetría operacional"
      - "Every production run records exact versions of agent, skill, policy, model configuration and capability contracts (cita literal, INV-E10) — capturar el VersionSnapshot exacto vigente en el momento de la decisión auditada"
      - "correlacionar cada AuditRecord con el actor (ActorId) y, cuando existe, el contexto (traceId) de la decisión auditada (INV-19)"
      - "garantizar, por ausencia estructural de cualquier función de actualización o borrado, que un AuditRecord ya escrito nunca se edite ni se elimine (write-once por diseño, no por convención)"
      - "producir una garantía de integridad verificable (contentHash) sobre el contenido de cada AuditRecord"
      - "rechazar por defecto (fail-closed) un AuditRecord sin referencia de sujeto, sin actor, o con un VersionSnapshot incompleto"
    does_not_own:
      - "distribuir el flujo general de eventos operacionales del harness hacia consumidores desacoplados (EventBus, CMP-009, ya introducido en CH-09 — la frontera más importante de este capítulo: EventBus mueve un AgentEvent mutable, de alto volumen, para logs/tracing/debugging; AuditLedger produce un subconjunto específico, estructuralmente inmutable, de evidencia — nunca el flujo general)"
      - "tomar la decisión que audita — evaluar policy (PolicyEngine, CMP-005, ya introducido en CH-05), aplicar control operacional (OperationalController, CMP-016, ya introducido en CH-18), decidir admisión (AdmissionController, CMP-012, ya introducido en CH-14), o cualquier otra decisión crítica ya tomada por su dueño correspondiente — AuditLedger registra una decisión YA TOMADA, nunca la toma ni la modifica"
      - "autorizar el acceso de lectura al propio ledger (Preview, fuera de alcance de este capítulo)"
      - "el mecanismo real y durable de almacenamiento append-only/WORM que preserva un AuditRecord más allá de la vida del proceso, y el algoritmo criptográfico real detrás de contentHash (Preview, infraestructura de borde)"
      - "generar por sí mismo el subjectRef o el VersionSnapshot — ambos llegan como señales de entrada ya resueltas (mismo patrón que targetRef en CH-18)"
    dependencies: []
    consumes: [C-004]
    produces: [C-010, C-011, C-029]
    introduced_in: CH-19
    constitutional_articles: [P-13, P-25, INV-18, INV-19, INV-20, INV-E10]

  - id: CMP-018
    name: DataGovernanceEngine
    responsibility: >
      Clasificar cualquier dato que fluye por el sistema (un ContextBlock ya seleccionado, un
      ToolResult ya producido, o cualquier otro dato futuro) con un nivel de sensibilidad, un
      requisito de residencia, una fecha límite de retención, una bandera de legal-hold y una
      referencia de lineage — produciendo una etiqueta de gobernanza portátil que viaja junto con
      el dato a través de fronteras de componentes, de forma completamente independiente de si el
      modelo entiende o acepta esos requisitos — sin decidir si ese dato es relevante para el turno
      actual, sin decidir si puede verse en absoluto, sin reclasificar un secreto ya clasificado por
      CredentialBroker y sin producir evidencia de auditoría inmutable.
    owns:
      - "Classification, residency, retention, lineage, encryption, deletion and legal-hold requirements MUST be enforceable independently of model reasoning (cita literal, P-22) — clasificar, en exclusiva, cualquier dato que fluya por el sistema con esos requisitos, resuelta por completo fuera del razonamiento del modelo"
      - "Data governance policy follows context and artifacts across component boundaries (cita literal, INV-E11) — producir una etiqueta portátil (DataGovernanceLabel), referenciada por subjectRef, consultable desde cualquier componente sin reabrir el dato original"
      - "decidir, para un plazo de retención dado, si el borrado ya es exigible, sigue sin serlo, o está suspendido por una preservación legal — sin borrar ni reemplazar nunca la fecha de retención original al aplicar esa suspensión"
      - "rechazar por defecto (fail-closed), hacia el nivel de clasificación más conservador (RESTRICTED), cualquier dato sin regla de gobernanza conocida"
      - "rechazar por defecto un DataGovernanceLabel sin referencia de sujeto o sin procedencia"
    does_not_own:
      - "seleccionar, rankear o componer qué contexto es relevante para que el modelo razone sobre un turno (ContextEngine, CMP-004, ya introducido en CH-04 — la frontera más importante de este capítulo: ContextEngine decide QUÉ material entra dentro de un presupuesto; DataGovernanceEngine decide QUÉ REQUISITOS de gobierno aplican a lo que ya se decidió incluir)"
      - "autorizar si un dato puede verse en absoluto (PolicyEngine, CMP-005, ya introducido en CH-05 — distinta pregunta, distinto dominio: \"¿cuán sensible es esto?\" nunca es \"¿puede verse esto en absoluto?\")"
      - "reclasificar un secreto que CredentialBroker ya clasificó con CredentialClassification (CredentialBroker, CMP-014, ya introducido en CH-16 — esquema narrow de dos valores, exclusivo de credenciales; DataGovernanceEngine generaliza P-22 a cualquier OTRO dato, sin tocar el contrato de CH-16)"
      - "producir evidencia de auditoría estructuralmente inmutable sobre una clasificación ya producida (AuditLedger, CMP-017, ya introducido en CH-19 — un DataGovernanceLabel describe la clasificación vigente hoy, no evidencia permanente de que ocurrió)"
      - "aislar operacionalmente los runs de un tenant (OperationalController, CMP-016, ya introducido en CH-18 — aislamiento operacional es una decisión distinta de clasificar un dato, aunque ambas toquen, en espíritu, \"quién puede ver qué\")"
      - "ejecutar el borrado real, el cifrado real, o el mecanismo real que mueve o almacena un dato físicamente dentro de una región concreta (Preview, infraestructura de borde)"
      - "generar por sí mismo el subjectRef, la procedencia o la bandera de legal-hold — todas llegan como señales de entrada ya resueltas (mismo patrón que targetRef en CH-18 o subjectRef en CH-19)"
    dependencies: []
    consumes: [C-004]
    produces: [C-010, C-011, C-030]
    introduced_in: CH-20
    constitutional_articles: [P-13, P-22, INV-18, INV-19, INV-20, INV-E11]

  - id: CMP-019
    name: ExecutionFabricAdapter
    responsibility: >
      Abstraer, detrás de una interfaz uniforme, el substrato de cómputo concreto sobre el que se
      materializa la ejecución de un run ya existente (in-process, worker, Kubernetes, serverless,
      cloud, edge, on-premise) — produciendo un ExecutionPlacement opaco y portátil que describe
      esa topología sin exponer el detalle real de cada substrato, y registrando, cuando aplica,
      una restricción de residencia sobre DÓNDE se ejecuta ese cómputo — sin decidir límites de
      recursos o presupuesto de un run, sin invocar proveedores de modelo, sin adaptar protocolos
      de comunicación entre agentes externos y sin instanciar el AgentState inicial de un run.
    owns:
      - "Agent behavior MUST NOT depend on whether execution occurs in-process, on a worker, Kubernetes, serverless, cloud, edge or on-premise (cita literal, P-27) — abstraer, en exclusiva, el substrato de cómputo concreto sobre el que corre la ejecución de un run detrás de una interfaz uniforme"
      - "producir, para un run ya existente (runId), una referencia opaca y uniforme al substrato de cómputo (topology + computeResourceRef) — nunca el detalle real de cada substrato concreto"
      - "registrar, cuando aplica, una restricción de residencia geográfica sobre DÓNDE se ejecuta el cómputo de un run — distinta de dónde debe residir el DATO que ese run procesa"
      - "rechazar por defecto (fail-closed) un ExecutionPlacement sin referencia al run que representa"
    does_not_own:
      - "decidir límites de recursos o presupuesto de un run — cuánto tiempo puede correr, cuántas tool calls concurrentes, cuánto cuesta (ExecutionController, CMP-007, ya introducido en CH-07 — la frontera más importante de este capítulo: ExecutionController decide CUÁNTO puede consumir un run ya en marcha, en cualquier substrato; ExecutionFabricAdapter describe DÓNDE/EN QUÉ TIPO DE INFRAESTRUCTURA corre ese mismo run — dos preguntas ortogonales sobre el mismo run)"
      - "invocar proveedores de modelo concretos (ModelGateway, CMP-003, ya introducido en CH-03 — ModelGateway adapta HACIA AFUERA, hacia qué proveedor de modelo; ExecutionFabricAdapter adapta HACIA ABAJO, hacia qué substrato de cómputo corre el propio harness)"
      - "adaptar protocolos de comunicación entre agentes externos (AgentCommunicationGateway, CMP-013, ya introducido en CH-15 — adapta hacia protocolos de interoperabilidad entre agentes, no hacia el substrato de cómputo del propio harness)"
      - "instanciar el AgentState inicial de un run (AgentCore, CMP-011, ya introducido en CH-11 — ExecutionFabricAdapter describe sobre qué substrato corre un run YA instanciado, nunca lo crea)"
      - "clasificar los requisitos de gobernanza de un dato, incluida su residencia (DataGovernanceEngine, CMP-018, ya introducido en CH-20 — residencyRequirement ahí describe dónde debe residir el DATO; residencyConstraint aquí describe dónde se ejecuta el CÓMPUTO del run — conceptos relacionados pero distintos)"
      - "ejecutar el aprovisionamiento real, el scheduling real, o el mecanismo real que efectivamente coloca un proceso dentro de un pod de Kubernetes, una función serverless o un nodo edge (Preview, infraestructura de borde)"
      - "generar por sí mismo el runId, la topología o el computeResourceRef — todas llegan como señales de entrada ya resueltas (mismo patrón que subjectRef en CH-19/CH-20)"
    dependencies: []
    consumes: [C-004]
    produces: [C-010, C-011, C-031]
    introduced_in: CH-21
    constitutional_articles: [P-13, P-27, INV-18, INV-19, INV-20]

  - id: CMP-020
    name: EvaluationHarness
    responsibility: >
      Evaluar cualquier candidato (un agente, un prompt, una skill, un modelo, una policy o una
      capability) ANTES de su promoción controlada a producción, aplicando o verificando la policy
      de certificación que su clase de riesgo exige y produciendo un resultado de tres estados que
      nunca se reduce a aprobado/rechazado cuando la decisión no puede tomarse todavía — y
      correlacionar la ejecución de un run ya existente con un outcome de negocio medible, un
      SLA/SLO aplicable y una posible escalación humana — sin evaluar ni autorizar ninguna acción
      dentro de un run en curso, sin producir evidencia de auditoría inmutable, sin registrar
      versiones de capability y sin decidir si un run puede continuar operacionalmente.
    owns:
      - "Candidate agents, prompts, skills, models, policies and capabilities MUST be evaluable in an Evaluation Harness before controlled promotion to production (cita literal, P-28) — evaluar, en exclusiva, cualquier candidato completo antes de su promoción controlada a producción, completamente separado de evaluar una acción dentro de un run ya existente"
      - "Production promotion requires certification policy where risk class requires it (cita literal, INV-E13) — aplicar o verificar, según la RiskClass de un candidato, si una policy de certificación aplica, produciendo NEEDS_REVIEW en vez de fabricar CERTIFIED/REJECTED cuando esa certificación no puede resolverse todavía"
      - "Technical success does not imply business success. Enterprise runs SHOULD correlate execution with measurable outcomes, value, SLA/SLO and human escalation (cita literal, P-29) — correlacionar, en exclusiva, la ejecución de un run ya existente con un outcome de negocio medible, una referencia opaca a un SLA/SLO aplicable, y una posible escalación humana"
      - "rechazar por defecto (fail-closed) un EvaluationReport sin referencia al candidato que evalúa, o un BusinessOutcomeCorrelation sin referencia al run que correlaciona"
    does_not_own:
      - "evaluar o autorizar una acción concreta dentro de un run ya en curso (PolicyEngine, CMP-005, ya introducido en CH-05 — la frontera más importante de este capítulo: PolicyEngine decide si UNA ACCIÓN puede ocurrir DENTRO de un run que ya existe; EvaluationHarness decide si UN CANDIDATO debe promoverse a producción ANTES de que exista ningún run que lo use)"
      - "producir evidencia de auditoría estructuralmente inmutable sobre la decisión de certificación (AuditLedger, CMP-017, ya introducido en CH-19 — EvaluationHarness produce el resultado de evaluación; auditarlo de forma inmutable, si alguien lo necesita, es responsabilidad de AuditLedger)"
      - "registrar versiones de capability o gestionar su lifecycle de rollout/deprecation/retirement (CapabilityRegistry, CMP-008, ya introducido en CH-08 — CapabilityRegistry declara qué CapabilityDescriptor existen y cuál es su version; EvaluationHarness evalúa, mediante subjectRef, si una versión concreta YA REGISTRADA debe certificarse)"
      - "decidir si un run puede continuar operacionalmente contra su ExecutionBudget (ExecutionController, CMP-007, ya introducido en CH-07)"
      - "representar, persistir o resolver la intervención humana que NEEDS_REVIEW exige (HumanInteractionService, CMP-006, ya introducido en CH-06 — EvaluationHarness produce el estado que exige esa intervención; HumanInteractionService es quien la representa, persiste y resuelve)"
      - "aplicar kill switches, aislamiento de tenant, o cualquier otro control operacional (OperationalController, CMP-016, ya introducido en CH-18)"
      - "ejecutar el mecanismo real de evaluación — correr el candidato contra un dataset de test real, calcular métricas reales de calidad o seguridad, o medir en la práctica un outcome de negocio (Preview, infraestructura de borde)"
      - "generar por sí mismo el subjectRef, la riskClass, la señal de si la certificación ya se satisfizo, el runId o el measuredOutcome — todas llegan como señales de entrada ya resueltas (mismo patrón que subjectRef en CH-19/CH-20, o runId/topology en CH-21)"
    dependencies: []
    consumes: [C-004]
    produces: [C-010, C-011, C-032, C-033]
    introduced_in: CH-22
    constitutional_articles: [P-13, P-28, P-29, INV-E13, INV-18, INV-19, INV-20]

  - id: CMP-021
    name: HandoffCoordinator
    responsibility: >
      Empaquetar un HandoffPackage estructurado cuando la decisión de transferir el control
      COMPLETO de un run/sesión a un humano ya se tomó — con campos estructurados que nunca
      colapsan a un resumen de prosa libre — sin decidir CUÁNDO debe ocurrir ese handoff, sin
      pedir o persistir una decisión puntual dentro de un turno en curso, y sin ejecutar ninguna
      acción una vez que el humano toma control.
    owns:
      - "A human handoff transfers a structured HandoffPackage rather than only prose (cita literal, INV-E12) — construir, en exclusiva, el paquete estructurado que representa la transferencia COMPLETA de control de un run/sesión a un humano, nunca solo un bloque de texto libre resumiendo la situación"
      - "correlacionar, opcionalmente, un HandoffPackage con una HumanInteractionRequest ya existente (CMP-006, CH-06) vía una referencia reusada, sin modificar ese contrato"
      - "rechazar por defecto (fail-closed) un HandoffPackage sin referencia al run/sesión que se transfiere"
    does_not_own:
      - "pedir o persistir una decisión puntual dentro de un turno en curso (HumanInteractionService, CMP-006, ya introducido en CH-06 — la frontera más importante de este capítulo: HumanInteractionService representa y resuelve UNA decisión puntual dentro de un turno que sigue en marcha; HandoffCoordinator empaqueta la transferencia del CONTROL COMPLETO de un run/sesión, nunca una decisión aislada dentro de él)"
      - "decidir CUÁNDO debe ocurrir un handoff (OperationalController, CMP-016, ya introducido en CH-18, vía un kill switch; ExecutionController, CMP-007, ya introducido en CH-07, vía terminación; o PolicyEngine, CMP-005, ya introducido en CH-05 — HandoffCoordinator construye el paquete UNA VEZ que esa decisión ya se tomó, nunca antes)"
      - "ejecutar cualquier acción una vez que el humano toma control del run/sesión transferido (Preview, infraestructura de borde — fuera de alcance de este capítulo)"
      - "transportar el HandoffPackage a través de ningún canal concreto (Channel Adapter, concepto de infraestructura de borde ya declarado por HumanInteractionService, CH-06 — no un componente propio de Article III / del registry)"
      - "generar por sí mismo el runId, el sessionId, la reason, el contextRef o el transferTo — todas llegan como señales de entrada ya resueltas (mismo patrón que subjectRef en CH-19/CH-20/CH-22, o runId/topology en CH-21)"
    dependencies: []
    consumes: [C-004]
    produces: [C-010, C-011, C-034]
    introduced_in: CH-23
    constitutional_articles: [P-13, INV-E12, INV-18, INV-19, INV-20]
