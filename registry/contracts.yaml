  # EvaluationReport); `transferTo` reutiliza ActorId (CH-06); `humanInteractionRef` es
  # Optional<HumanInteractionRequestId> — correlación opcional y reusada, sin modificar
  # HumanInteractionRequest (CH-06); `status` es un ENUM de tres valores (PENDING/ACCEPTED/
