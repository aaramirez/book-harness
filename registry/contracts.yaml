  # C-013: de los cinco ids que CH-01 §7 dejó reservados (C-005..C-009), los cinco ya están
  # asignados — C-005 (ContextSnapshot) en CH-04, C-006/C-007 (ModelRequest/ModelResponse) en
  # CH-03, C-008/C-009 (ToolCall/ToolResult) en CH-02. No queda ningún id reservado de ese lote
  # original. Ver decisión de diseño en planes/2026-09-13-capitulo-01-agent-loop.md,
  # planes/2026-09-13-capitulo-02-tool-runtime.md, planes/2026-09-13-capitulo-03-model-gateway.md
  # y planes/2026-09-13-capitulo-04-context-engine.md.
  - id: C-013
    name: AgentRunStatus
    version: v1
    introduced_in: CH-01
    current_definition: |
      ENUM AgentRunStatus
          CREATED
          INITIALIZING
          RUNNING
          WAITING_FOR_MODEL
          WAITING_FOR_TOOL
          WAITING_FOR_HUMAN
          PAUSED
          COMPLETED
          FAILED
          CANCELLED
          EXPIRED
      END
    used_by: [CMP-001, CMP-016]
    modified_by: []
    constitutional_impact: [P-10, INV-08, INV-09]

  # C-014 (PolicyDecision): primer id verdaderamente NUEVO del libro — a diferencia de C-005..C-013,
  # que ya estaban reservados desde CH-01 §7, ningún capítulo anterior reservó C-014. Ver decisión de
  # diseño en planes/2026-09-14-capitulo-05-policy-engine.md: el resultado normalizado de que
  # PolicyEngine evalúe un ToolCall ya resuelto (CH-02), con un resultado de tres estados
  # (allow/deny/require_approval, nunca un Boolean) y trazabilidad explícita hacia la policy rule
  # que motivó la decisión (INV-19).
  - id: C-014
    name: PolicyDecision
    version: v1
    introduced_in: CH-05
    current_definition: |
      STRUCT PolicyDecision
          callId: ToolCallId
          outcome: PolicyOutcome
          policyRuleId: Text
          reason: Optional<HarnessError>
          decidedAt: Timestamp
      END
    used_by: [CMP-005, CMP-006]
    modified_by: []
    constitutional_impact: [P-05, P-13, INV-06, INV-15, INV-19]

  # C-015/C-016 (HumanInteractionRequest/HumanInteractionResolution): segundo y tercer id
