# Contract Registry — book-harness
#
# Fuente de verdad canónica de contratos (estructuras de datos con nombre estable) introducidos
# a lo largo del libro. Esquema exigido por REGLAS_LIBRO_AGENT_HARNESS(1).md §10:
#
#   id:                     C-XXX (correlativo, nunca se reutiliza)
#   name:                   nombre canónico (PascalCase, en inglés)
#   version:                versión del contrato (v1, v2, ...)
#   introduced_in:          ChapterId (debe existir en book/book.yaml)
#   current_definition:     bloque STRUCT/ENUM canónico vigente (pseudocódigo)
#   used_by:                lista de ComponentId que consumen o producen este contrato
#   modified_by:            lista de ChapterId que han modificado este contrato (vacío si ninguno)
#   constitutional_impact:  lista de ArticleId (P-xx / INV-xx) relevantes
#
# Regla: un contrato solo puede aparecer aquí si el capítulo que lo introduce ya pasó
# `validate-chapter`. Un capítulo NUNCA puede referenciar en pseudocódigo un contrato cuyo
# `introduced_in` sea un capítulo posterior en `book/book.yaml` (validate-chapter lo rechaza).
#
# Estado al iniciar la Fase 1: vacío (solo este esquema). Poblado en la Fase 5 con los contratos
# reales introducidos por el capítulo piloto (CH-00).

contracts:
