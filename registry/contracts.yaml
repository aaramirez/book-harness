  # C-035 (SkillDescriptor): vigesimosegundo id verdaderamente NUEVO del libro (el correlativo
  # continúa después de C-034, CH-23 — ningún id quedaba reservado desde CH-01 §7). Ver decisión de
  # diseño en planes/2026-09-18-capitulo-24-skill-library.md: el registro de una skill que P-07
  # exige como conocimiento procedural reusable, SEPARADO de CapabilityDescriptor (C-018, CH-08) —
  # CapabilityDescriptor resuelve QUÉ IMPLEMENTACIÓN CONCRETA satisface una capability solicitada;
  # SkillDescriptor resuelve QUÉ PROCEDIMIENTO/GUÍA reusable aplica a una situación — dos capas
  # ortogonales, deliberadamente con la misma forma de cinco campos que CapabilityDescriptor para
  # hacer el contraste legible, nunca para sugerir que son el mismo concepto. `skill` reutiliza el
  # mismo patrón que `capability: CapabilityId` en CapabilityDescriptor (C-018) — el identificador
  # ya resuelto que este descriptor produce, no un id de fila separado; `version` reusa el mismo
  # criterio de versionado (Text explícito) que P-26/CapabilityDescriptor.version ya establecieron,
  # sin que P-26 en sí (literalmente sobre "Tools/capabilities") se extienda a skills — decisión de
  # consistencia de diseño, no una cita constitucional nueva; `procedureRef` es una referencia opaca
  # Text al procedimiento/guía real, nunca su contenido en prosa completo (mismo patrón que
  # `implementationRef` en CapabilityDescriptor); `appliesTo` es Optional<Text>, una referencia
  # opaca y opcional a qué capabilities/situaciones aplica esta skill — se evaluó explícitamente
  # List<CapabilityId> y se descartó por modelar una relación estructurada que este capítulo no
  # necesita resolver todavía (ver decisión completa en el propio capítulo, seccion 6).
  - id: C-035
    name: SkillDescriptor
    version: v1
    introduced_in: CH-24
    current_definition: |
      STRUCT SkillDescriptor
          skill: SkillId
          name: Text
          version: Text
          procedureRef: Text
          appliesTo: Optional<Text>
      END
    used_by: [CMP-022]
    modified_by: []
    constitutional_impact: [P-07, INV-19]

  # C-036 (PendingInput): primer id del Tramo 4 (Amendment v1.2 ya ratificado; el correlativo
  # continúa después de C-035, CH-24 — CH-25..CH-27 no introdujeron contratos). Ver decisión de
  # diseño en planes/2026-09-25-capitulo-28-steering-follow-up.md: una entrada del usuario que llega
  # MIENTRAS el turno todavía corre — nunca una resolución humana (HumanInteractionResolution, CH-06)
  # ni una cancelación (ExecutionController/OperationalController). `kind` (PendingInputKind,
  # embebido: STEER/FOLLOW_UP) decide en qué frontera del turno se aplica; el modo de entrega
  # (ONE_AT_A_TIME/ALL) vive en la cola (PendingInputQueue, embebida), no en cada entrada — un
  # mensaje no elige cómo se le entrega. `message` reusa AgentMessage (C-001) tal cual: la entrada
  # pendiente ES un mensaje de rol USER que todavía no entró al contexto.
  - id: C-036
    name: PendingInput
    version: v1
    introduced_in: CH-28
    current_definition: |
      STRUCT PendingInput
          id: PendingInputId
          runId: RunId
          kind: PendingInputKind
          message: AgentMessage
          receivedAt: Timestamp
      END
    used_by: [CMP-001]
    modified_by: []
    constitutional_impact: [P-10, INV-08, INV-07]

  # C-037 (CompactionSummary): ContextEngine (CMP-004) ya posee "compaction" (Article III) y CH-04
  # decidió no crear un componente Compactor/Summarizer. Este contrato fija la FORMA del resumen de
  # la región antigua de un historial: el texto de cada campo lo propone el modelo (agéntico,
  # Article XII); ContextEngine valida la estructura y decide dónde cortar (determinístico).
  # firstKeptMessageId marca desde dónde el historial se conserva literal; provenance cumple
