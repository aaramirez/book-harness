  # subjectRef es una referencia opaca al contrato de decisión original ya producido por otro
  # componente (PolicyDecision/ControlDirective/AdmissionDecision/etc. — nunca un campo por tipo
  # posible, mismo argumento que ControlDirective.targetRef, CH-18); versionSnapshot embebe, sin
