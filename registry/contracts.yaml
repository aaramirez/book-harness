      STRUCT ExecutionPlacement
          id: ExecutionPlacementId
          runId: RunId
          topology: DeploymentTopology
          computeResourceRef: Optional<Text>
          residencyConstraint: Optional<Text>
          resolvedAt: Timestamp
      END
    used_by: [CMP-019]
    modified_by: []
    constitutional_impact: [P-27, INV-19]

  # C-032 (EvaluationReport): decimonoveno id verdaderamente NUEVO del libro (el correlativo
