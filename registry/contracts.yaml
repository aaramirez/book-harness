  # C-034 (HandoffPackage): vigesimoprimer id verdaderamente NUEVO del libro (el correlativo
  # continúa después de C-033, CH-22 — ningún id quedaba reservado desde CH-01 §7). Ver decisión
  # de diseño en planes/2026-09-18-capitulo-23-handoff-coordinator.md: el paquete ESTRUCTURADO que
  # INV-E12 exige para transferir el control COMPLETO de un run/sesión a un humano — cita literal,
  # INV-E12 ("A human handoff transfers a structured HandoffPackage rather than only prose").
  # `runId`/`sessionId` son identificadores YA EXISTENTES (RunId/SessionId, CH-00) — el universo de
  # lo que este contrato describe es siempre exactamente un run/sesión, nunca un tipo heterogéneo;
  # `reason` es un ENUM de cuatro valores (MODEL_STUCK/KILL_SWITCH/BUDGET_EXHAUSTED/
