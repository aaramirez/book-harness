# Contract Registry — book-harness
#
# Fuente de verdad canónica de contratos (estructuras de datos con nombre estable) introducidos
# a lo largo del libro. Esquema exigido por REGLAS_LIBRO_AGENT_HARNESS(1).md §10:
#
#   id:                     C-XXX (correlativo, nunca se reutiliza)
#   name:                   nombre canónico (PascalCase, en inglés)
#   version:                versión del contrato (v1, v2, ...)
#   introduced_in:          ChapterId (debe existir en book/book.yaml)
#   current_definition:     bloque STRUCT/ENUM canónico vigente (pseudocódigo)
#   used_by:                lista de ComponentId que consumen o producen este contrato
#   modified_by:            lista de ChapterId que han modificado este contrato (vacío si ninguno)
#   constitutional_impact:  lista de ArticleId (P-xx / INV-xx) relevantes
#
# Regla: un contrato solo puede aparecer aquí si el capítulo que lo introduce ya pasó
# `validate-chapter`. Un capítulo NUNCA puede referenciar en pseudocódigo un contrato cuyo
# `introduced_in` sea un capítulo posterior en `book/book.yaml` (validate-chapter lo rechaza).
#
# Estado al iniciar la Fase 1: vacío (solo este esquema). Poblado en la Fase 5 con los contratos
# reales introducidos por el capítulo piloto (CH-00).

contracts:
  - id: C-001
    name: AgentMessage
    version: v1
    introduced_in: CH-00
    current_definition: |
      STRUCT AgentMessage
          id: MessageId
          role: MessageRole
          content: Value
          timestamp: Timestamp
      END
    used_by: [CMP-003, CMP-004]
    modified_by: []
    constitutional_impact: [P-02, INV-02]

  - id: C-002
    name: AgentConfig
    version: v1
    introduced_in: CH-00
    current_definition: |
      STRUCT AgentConfig
          agentId: AgentId
          name: Text
          budget: ExecutionBudget
      END
    used_by: [CMP-001]
    modified_by: []
    constitutional_impact: [P-06]

  - id: C-003
    name: AgentState
    version: v1
    introduced_in: CH-00
    current_definition: |
      STRUCT AgentState
          runId: RunId
          sessionId: SessionId
          agentId: AgentId
          status: AgentRunStatus
          currentTurn: Integer
      END
    used_by: [CMP-001, CMP-004, CMP-007, CMP-010]
    modified_by: []
    constitutional_impact: [P-08, P-10, INV-12]

  - id: C-004
    name: ExecutionContext
    version: v1
    introduced_in: CH-00
    current_definition: |
      STRUCT ExecutionContext
          runId: RunId
          sessionId: SessionId
          traceId: TraceId
          budget: ExecutionBudget
      END
    used_by: [CMP-001, CMP-002, CMP-003, CMP-004, CMP-005, CMP-006, CMP-007, CMP-008, CMP-010]
    modified_by: []
    constitutional_impact: [P-01, P-14]

  # C-005 (ContextSnapshot): ya asignado en CH-04 (ver decisión de diseño en
  # planes/2026-09-13-capitulo-04-context-engine.md) — era el único id que seguía reservado por
  # convención editorial desde CH-01 §7 (ver reference/md/REGLAS_LIBRO_AGENT_HARNESS(1).md §10,
  # ejemplo de numeración). C-006/C-007 (ModelRequest/ModelResponse), reservados desde CH-01, ya
  # se asignaron en CH-03 (ver decisión de diseño en
  # planes/2026-09-13-capitulo-03-model-gateway.md). C-008/C-009 (ToolCall/ToolResult), también
  # reservados desde CH-01, ya se asignaron en CH-02 (ver decisión de diseño en
  # planes/2026-09-13-capitulo-02-tool-runtime.md). Con C-005 asignado, no queda ningún id
  # reservado del lote original que CH-01 §7 documentó (C-005..C-009).
  - id: C-005
    name: ContextSnapshot
    version: v1
    introduced_in: CH-04
    current_definition: |
      STRUCT ContextSnapshot
          blocks: List<ContextBlock>
          budget: ExecutionBudget
          estimatedTokens: Integer
          producedAt: Timestamp
      END
    used_by: [CMP-004]
    modified_by: []
    constitutional_impact: [P-01, P-14, INV-09]

  - id: C-006
    name: ModelRequest
    version: v1
    introduced_in: CH-03
    current_definition: |
      STRUCT ModelRequest
          messages: List<AgentMessage>
          budget: ExecutionBudget
          requestedAt: Timestamp
      END
    used_by: [CMP-003]
    modified_by: []
    constitutional_impact: [P-01, P-02, INV-02]

  - id: C-007
    name: ModelResponse
    version: v1
