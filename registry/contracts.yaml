    used_by: [CMP-002, CMP-005, CMP-008]
    modified_by: []
    constitutional_impact: [P-03, INV-04, INV-05]

  - id: C-009
    name: ToolResult
    version: v1
    introduced_in: CH-02
    current_definition: |
      STRUCT ToolResult
          callId: ToolCallId
