      STRUCT CompactionSummary
          goal: Text
          constraints: List<Text>
          progress: List<Text>
          decisions: List<Text>
          nextSteps: List<Text>
          criticalContext: List<Text>
          touchedFiles: List<Text>
          firstKeptMessageId: MessageId
          provenance: Text
      END
    used_by: [CMP-004, CMP-010]
    modified_by: []
    constitutional_impact: [P-01, P-14, INV-07]

  # C-038 (BranchSummary): el resumen de la rama que se abandona al navegar dentro de una sesión
  # hacia un checkpoint anterior (SessionManager, CMP-010, owns "branching"). Reutiliza
  # CompactionSummary como forma — una rama abandonada se resume igual que una región antigua.
  # abandonedTipId es la punta que se deja (sigue direccionable: navegar no borra); resumedFromId es
  # el checkpoint desde el que continúa el próximo turno. Distinto de branchSessionFromCheckpoint
  # (CH-10), que crea una SESIÓN nueva; esto navega DENTRO de la misma sesión.
