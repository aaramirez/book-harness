  # planes/2026-09-14-capitulo-06-human-interaction-service.md: el primer par solicitud/resolución
  # que representa y resuelve una PolicyDecision con outcome = REQUIRE_APPROVAL (CH-05),
  # deliberadamente sin ningún campo de canal (INV-14, Article VIII Human Interaction Rule).
  - id: C-015
    name: HumanInteractionRequest
    version: v1
    introduced_in: CH-06
    current_definition: |
      STRUCT HumanInteractionRequest
          id: HumanInteractionRequestId
          type: HumanInteractionType
          callId: ToolCallId
          status: HumanInteractionStatus
          requestedAt: Timestamp
      END
    used_by: [CMP-006]
    modified_by: []
    constitutional_impact: [INV-14, INV-15, INV-18, INV-19]

  - id: C-016
    name: HumanInteractionResolution
    version: v1
    introduced_in: CH-06
    current_definition: |
      STRUCT HumanInteractionResolution
          requestId: HumanInteractionRequestId
          outcome: HumanInteractionOutcome
          value: Optional<Value>
          resolvedBy: ActorId
          resolvedAt: Timestamp
      END
    used_by: [CMP-006]
    modified_by: []
    constitutional_impact: [INV-14, INV-15, INV-18, INV-19]

  # C-017 (ExecutionDecision): cuarto id verdaderamente NUEVO del libro (el correlativo continúa
  # después de C-016, CH-06 — ningún id quedaba reservado desde CH-01 §7). Ver decisión de diseño
  # en planes/2026-09-14-capitulo-07-execution-controller.md: el resultado normalizado de que
  # ExecutionController evalúe si un AgentRun puede continuar operacionalmente contra su
  # ExecutionBudget (C-012, CH-00) — un outcome de tres estados (continue/stop/cancelled, nunca un
  # Boolean), la razón estructurada cuando se detiene por presupuesto, y el uso actual (embebido
  # como ExecutionUsage, sin contrato C-XXX propio — mismo patrón que RawToolCallProposal embebido
  # en ModelResponse, CH-03) contra el que se evaluó, dado que C-003 AgentState solo trackea
  # currentTurn y C-012 ExecutionBudget nunca se modifica retroactivamente.
  - id: C-017
    name: ExecutionDecision
    version: v1
    introduced_in: CH-07
    current_definition: |
      STRUCT ExecutionDecision
          runId: RunId
          outcome: ExecutionOutcome
          stopReason: Optional<ExecutionStopReason>
          reason: Optional<HarnessError>
          usage: ExecutionUsage
          evaluatedAt: Timestamp
      END
    used_by: [CMP-007]
    modified_by: []
    constitutional_impact: [P-10, INV-08, INV-09, INV-10, INV-18, INV-19, INV-20]

  # C-018 (CapabilityDescriptor): quinto id verdaderamente NUEVO del libro (el correlativo continúa
  # después de C-017, CH-07 — ningún id quedaba reservado desde CH-01 §7). Ver decisión de diseño en
  # planes/2026-09-14-capitulo-08-capability-registry.md: el descriptor registrado de una
  # capability — nombre canónico, versión explícita (P-26, Amendment v1.1), el schema de entrada
  # esperado (contra el que se valida rawArguments) y una referencia opaca a su implementación
  # concreta — que CapabilityRegistry resuelve contra el capabilityName de una RawToolCallProposal
  # (embebida en ModelResponse, C-007, CH-03) para producir, por primera vez con una resolución
  # real, un ToolCall (C-008, CH-02) válido.
  # C-018 v2 (CH-30, ADR-002 Accepted 2026-09-25): agrega replayPolicy (Optional<ReplayPolicy>).
  # NULL equivale a NEVER (fail-closed) vía effectiveReplayPolicy: ningún descriptor ya registrado
  # cambia de comportamiento. Vuelve a cambiar en CH-39 (sourceConnectionId, ADR-005).
  - id: C-018
    name: CapabilityDescriptor
    version: v2
    introduced_in: CH-08
    current_definition: |
      STRUCT CapabilityDescriptor
          capability: CapabilityId
          name: Text
          version: Text
          inputSchema: Value
          implementationRef: Text
          replayPolicy: Optional<ReplayPolicy>
      END
    used_by: [CMP-008, CMP-015]
    modified_by: [CH-30]
    constitutional_impact: [P-03, P-26, INV-04, INV-20]

  # C-019 (EventSubscription): sexto id verdaderamente NUEVO del libro (el correlativo continúa
  # después de C-018, CH-08 — ningún id quedaba reservado desde CH-01 §7). Ver decisión de diseño en
  # planes/2026-09-14-capitulo-09-event-bus.md: el registro de la relación entre un consumidor
  # desacoplado (subscriberRef, opaco por diseño — Article III) y los AgentEvent que le interesan
  # (filter opcional por eventType/runId, embebido como EventFilter, sin contrato C-XXX propio —
  # mismo patrón que RawToolCallProposal/ContextBlock/ExecutionUsage), junto con su estado
  # (ACTIVE/CANCELLED). EventBus resuelve, contra este registro, a quién distribuir cada AgentEvent
  # (C-010, CH-00) ya producido por cualquier otro componente.
  - id: C-019
    name: EventSubscription
    version: v1
    introduced_in: CH-09
    current_definition: |
      STRUCT EventSubscription
          id: EventSubscriptionId
          subscriberRef: Text
          filter: Optional<EventFilter>
          status: EventSubscriptionStatus
          subscribedAt: Timestamp
      END
    used_by: [CMP-009]
    modified_by: []
    constitutional_impact: [P-04, P-12, INV-18, INV-19]

  # C-020 (SessionState): séptimo id verdaderamente NUEVO del libro (el correlativo continúa
  # después de C-019, CH-09 — ningún id quedaba reservado desde CH-01 §7). Ver decisión de diseño en
  # planes/2026-09-14-capitulo-10-session-manager.md: a diferencia de C-014..C-019, este contrato
  # formaliza un nombre que la Constitution ya citaba desde su primera versión adoptada (P-08,
  # INV-12: "AgentState y SessionState permanecen conceptualmente independientes") sin que ningún
  # capítulo lo hubiera registrado todavía — el mismo patrón que AgentRunStatus (C-013) resolvió en
  # CH-01, pero aplicado aquí a un STRUCT en vez de a un ENUM. Representa la historia persistida de
  # una sesión (qué RunId le pertenecen, desde qué SessionCheckpoint —embebido, sin contrato C-XXX
  # propio, mismo patrón que ContextBlock/ExecutionUsage/EventFilter— puede reconstruirse, y su
  # linaje opcional de ramificación) — nunca el estado operativo de una ejecución en curso, que sigue
  # siendo AgentState (C-003), propiedad exclusiva de AgentLoop.
  # C-020 v2 (CH-29, ADR-003 parte v2 — Accepted 2026-09-25): primera modificación real de un
  # contrato en el libro. Agrega activeCheckpointId (desde dónde continúa el próximo turno; NULL
  # = latestCheckpoint, como hasta CH-28) y branchSummaries (resúmenes de ramas abandonadas al
  # navegar). Ambos compatibles: CH-10..CH-28 siguen válidos sin tocarlos. Navegar no borra nada.
  - id: C-020
    name: SessionState
    version: v2
    introduced_in: CH-10
    current_definition: |
      STRUCT SessionState
          sessionId: SessionId
          runIds: List<RunId>
          latestCheckpoint: SessionCheckpoint
          parentCheckpointId: Optional<SessionCheckpointId>
          activeCheckpointId: Optional<SessionCheckpointId>
          branchSummaries: List<BranchSummary>
          createdAt: Timestamp
          updatedAt: Timestamp
      END
    used_by: [CMP-010]
    modified_by: [CH-29]
    constitutional_impact: [P-08, P-23, INV-12, INV-13]

  # C-021 (AgentActivationRequest): octavo id verdaderamente NUEVO del libro (el correlativo
  # continúa después de C-020, CH-10 — ningún id quedaba reservado desde CH-01 §7). Ver decisión
  # de diseño en planes/2026-09-14-capitulo-11-agent-core.md: la solicitud de activar un run de un
  # agente ya configurado (agentId + AgentConfig ya registrado) — deliberadamente NO el mismo
  # concepto que ActivationRequest (Amendment v1.1, P-16/P-17), que normaliza un estímulo EXTERNO
  # crudo antes de que exista siquiera un agentId resuelto, evaluado por un AdmissionController
  # (Ingress & Activation Plane, Enterprise, fuera de alcance de BH-v0.1). Procesar este contrato
  # (activateAgent, CMP-011) produce, por primera vez con pseudocódigo real, la primera instancia
  # de un AgentState (C-003, CH-00) — status = CREATED, luego INITIALIZING.
  - id: C-021
    name: AgentActivationRequest
    version: v1
    introduced_in: CH-11
    current_definition: |
      STRUCT AgentActivationRequest
          agentId: AgentId
          sessionId: Optional<SessionId>
          input: Value
          requestedAt: Timestamp
      END
    used_by: [CMP-011]
    modified_by: []
    constitutional_impact: [P-06, P-10, INV-08, INV-09]

  # C-022/C-023 (ActivationRequest/AdmissionDecision): noveno y décimo id verdaderamente NUEVO del
  # libro (el correlativo continúa después de C-021, CH-11 — ningún id quedaba reservado desde
  # CH-01 §7). Ver decisión de diseño en planes/2026-09-14-capitulo-14-admission-controller.md: el
  # primer par solicitud/decisión de Amendment v1.1 (P-16/P-17) — el estímulo externo YA
  # normalizado por un ingress adapter (infraestructura de borde, fuera de este registry), sin
  # ningún agentId resuelto todavía, y el resultado determinístico (ADMIT/REJECT, nunca un
  # Boolean) de evaluar identity/authorization/tenant/capacity/rate/budget/deduplication/policy
  # (INV-E01/INV-E02) antes de que cualquier ruteo hacia un agente concreto sea siquiera posible.
  # Deliberadamente distinto de AgentActivationRequest (C-021, CH-11), que parte SIEMPRE de un
  # agentId ya conocido y ya registrado — CH-11 §6/§15 ya había anticipado y diferido esta
  # distinción bajo el término de glosario "Ingress Activation".
  - id: C-022
    name: ActivationRequest
    version: v1
    introduced_in: CH-14
    current_definition: |
      STRUCT ActivationRequest
          id: ActivationRequestId
          sourceRef: Text
          externalIdentityRef: Text
          payload: Value
          receivedAt: Timestamp
      END
    used_by: [CMP-012]
    modified_by: []
    constitutional_impact: [P-16, INV-E01]

  # C-023 v2 (CH-31, ADR-001 Accepted): agrega principal (Optional<Principal>): la identidad que
  # AdmissionController verificó al admitir. NULL en todo REJECT y en las decisiones de CH-14..CH-30.
  - id: C-023
    name: AdmissionDecision
    version: v2
    introduced_in: CH-14
    current_definition: |
      STRUCT AdmissionDecision
          requestId: ActivationRequestId
          outcome: AdmissionOutcome
          reason: Optional<HarnessError>
          principal: Optional<Principal>
          decidedAt: Timestamp
      END
    used_by: [CMP-012]
    modified_by: [CH-31]
    constitutional_impact: [P-17, INV-E02, INV-19, INV-20]

  # C-024/C-025 (AgentCommunicationMessage/DelegationGrant): undécimo y duodécimo id
  # verdaderamente NUEVO del libro (el correlativo continúa después de C-023, CH-14 — ningún id
  # quedaba reservado desde CH-01 §7). Ver decisión de diseño en
  # planes/2026-09-14-capitulo-15-agent-communication-gateway.md: el primer par contrato semántico/
  # token de delegación del Agent Interoperability Plane (Amendment v1.1, P-18/P-19/P-20/P-21) —
  # un mensaje entre dos agentes que cruza siempre una frontera explícita (boundary: INTERNAL/
  # EXTERNAL, cita literal de INV-E03), deliberadamente sin ningún campo de protocolo o transporte
  # (INV-E04), y un token de autoridad delegada scoped/time-bounded/auditable (P-21) cuyo budget
  # reutiliza ExecutionBudget (C-012, CH-00) sin modificarlo (INV-E06).
  - id: C-024
    name: AgentCommunicationMessage
    version: v1
    introduced_in: CH-15
    current_definition: |
      STRUCT AgentCommunicationMessage
          id: AgentCommunicationMessageId
          boundary: AgentCommunicationBoundary
          sourceAgentRef: Text
          targetAgentRef: Text
          content: Value
          delegationGrantId: Optional<DelegationGrantId>
          traceId: TraceId
          sentAt: Timestamp
      END
    used_by: [CMP-013]
    modified_by: []
    constitutional_impact: [P-18, P-20, INV-E03, INV-E04]

  - id: C-025
    name: DelegationGrant
    version: v1
    introduced_in: CH-15
    current_definition: |
      STRUCT DelegationGrant
          id: DelegationGrantId
          delegatingRunId: Optional<RunId>
          delegatorRef: Text
          delegateRef: Text
          delegatedScope: List<Text>
          budget: ExecutionBudget
          expiresAt: Timestamp
          grantedAt: Timestamp
      END
    used_by: [CMP-013]
    modified_by: []
    constitutional_impact: [P-21, INV-E06, INV-19]

  # C-026 (CredentialReference): decimotercer id verdaderamente NUEVO del libro (el correlativo
  # continúa después de C-025, CH-15 — ningún id quedaba reservado desde CH-01 §7). Ver decisión de
  # diseño en planes/2026-09-14-capitulo-16-credential-broker.md: la referencia opaca al secreto que
  # una implementación de capability ya resuelta (CapabilityDescriptor, C-018, CH-08) necesita para
  # autenticarse — cita literal de INV-E08 ("Credentials are resolved by a CredentialBroker and
  # SHOULD NOT enter model context"). Ningún campo de este STRUCT transporta jamás el valor real del
  # secreto — decisión de diseño explícita y deliberada, no una omisión. classification/expiresAt
  # son la primera materialización con código real de P-22 en todo el libro.
  - id: C-026
    name: CredentialReference
    version: v1
    introduced_in: CH-16
    current_definition: |
      STRUCT CredentialReference
          id: CredentialReferenceId
          capability: CapabilityId
          credentialName: Text
          classification: CredentialClassification
