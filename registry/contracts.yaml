  # `classification` es un ENUM de cuatro valores (PUBLIC/INTERNAL/CONFIDENTIAL/RESTRICTED, nunca un
  # Boolean); `legalHold` suspende cualquier borrado programado sin borrar ni reemplazar
  # `retentionDeadline` — la interacción documentada con cuidado en el propio capítulo (seccion 11).
  # A diferencia de AuditRecord (CH-19), no tiene campo `actor`: describe una propiedad del dato,
