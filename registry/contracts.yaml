      END
    used_by: [CMP-010, CMP-004]
    modified_by: []
    constitutional_impact: [P-08, INV-12, INV-13]

  # C-039 (ReplayPolicy): lo que una capability declara que el arnés debe hacer si no se sabe si su
  # efecto ocurrió (INV-E17, Amendment v1.2). NEVER: reportar el resultado desconocido al modelo,
  # nunca re-ejecutar; SAFE: re-ejecutar es seguro (p.ej. una lectura). Dos valores y no un Boolean
  # "idempotent": re-ejecutable (esto) y deduplicable por clave (IdempotencyRecord, CH-17) son
  # preguntas distintas. Ver planes/2026-09-25-capitulo-30-politica-de-replay.md.
  - id: C-039
    name: ReplayPolicy
    version: v1
    introduced_in: CH-30
    current_definition: |
      ENUM ReplayPolicy
          NEVER
          SAFE
      END
    used_by: [CMP-008, CMP-015]
    modified_by: []
    constitutional_impact: [P-24, INV-E09, INV-E17]

