# Contract Registry — book-harness
#
# Fuente de verdad canónica de contratos (estructuras de datos con nombre estable) introducidos
# a lo largo del libro. Esquema exigido por REGLAS_LIBRO_AGENT_HARNESS(1).md §10:
#
#   id:                     C-XXX (correlativo, nunca se reutiliza)
#   name:                   nombre canónico (PascalCase, en inglés)
#   version:                versión del contrato (v1, v2, ...)
#   introduced_in:          ChapterId (debe existir en book/book.yaml)
#   current_definition:     bloque STRUCT/ENUM canónico vigente (pseudocódigo)
#   used_by:                lista de ComponentId que consumen o producen este contrato
#   modified_by:            lista de ChapterId que han modificado este contrato (vacío si ninguno)
#   constitutional_impact:  lista de ArticleId (P-xx / INV-xx) relevantes
#
# Regla: un contrato solo puede aparecer aquí si el capítulo que lo introduce ya pasó
# `validate-chapter`. Un capítulo NUNCA puede referenciar en pseudocódigo un contrato cuyo
# `introduced_in` sea un capítulo posterior en `book/book.yaml` (validate-chapter lo rechaza).
#
# Estado al iniciar la Fase 1: vacío (solo este esquema). Poblado en la Fase 5 con los contratos
# reales introducidos por el capítulo piloto (CH-00).

contracts:
  - id: C-001
    name: AgentMessage
    version: v1
    introduced_in: CH-00
    current_definition: |
      STRUCT AgentMessage
          id: MessageId
          role: MessageRole
          content: Value
          timestamp: Timestamp
      END
    used_by: []
    modified_by: []
    constitutional_impact: [P-02, INV-02]

  - id: C-002
    name: AgentConfig
    version: v1
    introduced_in: CH-00
    current_definition: |
      STRUCT AgentConfig
          agentId: AgentId
          name: Text
          budget: ExecutionBudget
      END
    used_by: [CMP-001]
    modified_by: []
    constitutional_impact: [P-06]

  - id: C-003
    name: AgentState
    version: v1
    introduced_in: CH-00
    current_definition: |
      STRUCT AgentState
          runId: RunId
          sessionId: SessionId
          agentId: AgentId
          status: AgentRunStatus
          currentTurn: Integer
      END
    used_by: [CMP-001]
    modified_by: []
    constitutional_impact: [P-08, P-10, INV-12]

  - id: C-004
    name: ExecutionContext
    version: v1
    introduced_in: CH-00
    current_definition: |
      STRUCT ExecutionContext
          runId: RunId
          sessionId: SessionId
          traceId: TraceId
          budget: ExecutionBudget
      END
    used_by: [CMP-001, CMP-002]
    modified_by: []
    constitutional_impact: [P-01, P-14]

  # C-005..C-007 (no C-008/C-009): esos tres ids siguen reservados por convención editorial para
  # ContextSnapshot/ModelRequest/ModelResponse (ver reference/md/REGLAS_LIBRO_AGENT_HARNESS(1).md
  # §10, ejemplo de numeración) — llegarán con ModelGateway/ContextEngine en un capítulo posterior.
  # C-008/C-009 (ToolCall/ToolResult), también reservados desde CH-01, ya se asignaron en CH-02
  # (ver decisión de diseño en planes/2026-09-13-capitulo-02-tool-runtime.md).
  - id: C-008
    name: ToolCall
    version: v1
    introduced_in: CH-02
    current_definition: |
      STRUCT ToolCall
          id: ToolCallId
          capability: CapabilityId
          arguments: Map<Text, Value>
          requestedAt: Timestamp
      END
    used_by: [CMP-002]
    modified_by: []
    constitutional_impact: [P-03, INV-04, INV-05]

  - id: C-009
    name: ToolResult
    version: v1
    introduced_in: CH-02
    current_definition: |
      STRUCT ToolResult
          callId: ToolCallId
          succeeded: Boolean
          output: Optional<Value>
          error: Optional<HarnessError>
          completedAt: Timestamp
      END
    used_by: [CMP-002]
    modified_by: []
    constitutional_impact: [INV-07, INV-20, P-04]

  - id: C-010
    name: AgentEvent
    version: v1
    introduced_in: CH-00
    current_definition: |
      STRUCT AgentEvent
          eventId: EventId
          eventType: AgentEventType
          timestamp: Timestamp
          runId: RunId
          sessionId: SessionId
          agentId: AgentId
          traceId: TraceId
          payload: Value
      END
    used_by: [CMP-001, CMP-002]
    modified_by: []
    constitutional_impact: [P-04, INV-18, INV-19]

  - id: C-011
    name: HarnessError
    version: v1
    introduced_in: CH-00
    current_definition: |
      STRUCT HarnessError
          category: ErrorCategory
          code: Text
          message: Text
          recoverable: Boolean
          retryable: Boolean
          metadata: Map<Text, Value>
      END
    used_by: [CMP-001, CMP-002]
    modified_by: []
    constitutional_impact: [INV-20]

  - id: C-012
    name: ExecutionBudget
    version: v1
    introduced_in: CH-00
    current_definition: |
      STRUCT ExecutionBudget
          maxTurns: Integer
          maxToolCalls: Integer
          maxInputTokens: Integer
          maxOutputTokens: Integer
          maxCost: Number
          maxRuntimeMs: Integer
          maxConcurrentTools: Integer
      END
    used_by: []
    modified_by: []
    constitutional_impact: [P-10, INV-09]

  # C-013 (no C-005..C-007): esos tres ids siguen reservados (ver comentario junto a C-004 arriba)
  # para ContextSnapshot/ModelRequest/ModelResponse — llegarán con ModelGateway/ContextEngine en un
  # capítulo posterior. C-008/C-009 (ToolCall/ToolResult), reservados en CH-01, ya se asignaron en
  # CH-02. Ver decisión de diseño en planes/2026-09-13-capitulo-01-agent-loop.md y
  # planes/2026-09-13-capitulo-02-tool-runtime.md.
  - id: C-013
    name: AgentRunStatus
    version: v1
    introduced_in: CH-01
    current_definition: |
      ENUM AgentRunStatus
          CREATED
          INITIALIZING
          RUNNING
          WAITING_FOR_MODEL
          WAITING_FOR_TOOL
          WAITING_FOR_HUMAN
          PAUSED
          COMPLETED
          FAILED
          CANCELLED
          EXPIRED
      END
    used_by: [CMP-001]
    modified_by: []
    constitutional_impact: [P-10, INV-08, INV-09]
