  # UNKNOWN es la observación explícita (INV-07) de un efecto cuyo resultado externo no se sabe.
  - id: C-009
    name: ToolResult
    version: v2
    introduced_in: CH-02
    current_definition: |
      STRUCT ToolResult
          callId: ToolCallId
          succeeded: Boolean
