          INITIALIZING
          RUNNING
          WAITING_FOR_MODEL
          WAITING_FOR_TOOL
          WAITING_FOR_HUMAN
          PAUSED
          COMPLETED
          FAILED
          CANCELLED
          EXPIRED
      END
    used_by: [CMP-001]
    modified_by: []
    constitutional_impact: [P-10, INV-08, INV-09]

