# Debt Registry — book-harness
#
# Deuda declarada por los capítulos (sección 18) y por sus planes (sección "Deuda"), con destino
# verificable. Plan: planes/2026-09-26-tooling-registro-de-deuda.md.
#
#   id:               D-NNN (correlativo, nunca se reutiliza)
#   title:            una frase
#   origin:           ChapterId que la declaró (debe existir en book/book.yaml)
#   status:           open | resolved | out_of_scope
#   target:           (open) ChapterId planeado (CH-NN) o release (vX.Y.Z)
#   retargeted_from:  (opcional) destinos anteriores que no la resolvieron
#   resolved_in:      (resolved) ChapterId existente que la resolvió
#   rationale:        (out_of_scope, obligatorio) por qué no se resuelve
#
# scripts/validate-debt falla si una deuda open apunta a un capítulo que ya existe en
# book/book.yaml, o a una release que book.version ya alcanzó: la deuda quedó vencida. Para cerrar
# una deuda hay que marcarla resolved, moverla (dejando el destino anterior en retargeted_from) o
# declararla out_of_scope con su justificación.
#
# Carga inicial (2026-09-26): los puntos de "Deuda" de CH-28..CH-36. Los destinos de v0.3 usan la
# numeración del plan maestro vigente y se actualizan cuando se renumere v0.3.

