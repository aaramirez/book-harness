# Glossary Registry — book-harness
#
# Vocabulario técnico canónico del libro. Idioma del contenido: español, con el término técnico
# preservado en inglés (decisión §8.3 del plan). Esquema:
#
#   term:           término canónico, en inglés cuando así lo dicta la convención del libro
#   definition:     definición en español, una o dos frases
#   introduced_in:  ChapterId donde se define por primera vez
#   kind:           concept | contract | component | article
#   ref:            ContractId o ComponentId o ArticleId relacionado, cuando aplique (opcional)

terms:
  - term: Harness
    definition: >
      Runtime gobernado que permite a sistemas probabilísticos (modelos) proponer decisiones
      mientras mecanismos determinísticos controlan su ejecución, límites y consecuencias.
    introduced_in: CH-00
    kind: concept

  - term: Architecture Constitution
    definition: >
      Documento rector que define los principios (P-xx), invariantes (INV-xx) y fronteras de
      propiedad de componentes que gobiernan la evolución del arnés.
    introduced_in: CH-00
    kind: concept

  - term: Deterministic Boundary
    definition: >
      Frontera explícita que separa lo que un modelo puede proponer (intención semántica) de lo
      que el runtime determinístico decide y ejecuta (autorización, límites, estado).
    introduced_in: CH-00
    kind: concept

  - term: Component Sovereignty
    definition: >
      Principio por el cual cada componente del runtime tiene una responsabilidad exclusiva y
      fronteras explícitas de lo que NO posee, evitando que una decisión sea absorbida
      silenciosamente por un dominio equivocado.
    introduced_in: CH-00
    kind: concept

  - term: AgentMessage
    definition: >
      Contrato canónico e independiente de proveedor para representar un mensaje dentro del ciclo
      cognitivo del agente.
    introduced_in: CH-00
    kind: contract
    ref: C-001

  - term: AgentConfig
    definition: Configuración declarativa de un agente sobre el runtime compartido.
    introduced_in: CH-00
    kind: contract
    ref: C-002

  - term: AgentState
    definition: >
      Estado operativo de una ejecución (run) del agente, conceptualmente independiente del
      estado persistente de la sesión (SessionState).
    introduced_in: CH-00
    kind: contract
    ref: C-003

  - term: ExecutionContext
    definition: Contexto de ejecución que acompaña cada operación dentro de un run (runId, sessionId, traceId, budget).
    introduced_in: CH-00
    kind: contract
    ref: C-004

  - term: AgentEvent
    definition: >
      Envelope canónico de evento observable producido por cualquier acción significativa del
      runtime.
    introduced_in: CH-00
    kind: contract
    ref: C-010

  - term: HarnessError
    definition: >
      Contrato de error clasificado (categoría, recuperabilidad, reintentabilidad) usado en lugar
      de errores genéricos sin tipar.
    introduced_in: CH-00
    kind: contract
    ref: C-011

  - term: ExecutionBudget
    definition: >
      Conjunto explícito de límites operacionales (turnos, tool calls, tokens, costo, tiempo,
      concurrencia) que acota toda ejecución de un agente.
    introduced_in: CH-00
    kind: contract
    ref: C-012

  - term: Probabilistic System
    definition: >
      Componente cuya salida (típicamente un modelo de lenguaje) es una propuesta razonada, no una
      decisión operacional vinculante.
    introduced_in: CH-00
    kind: concept

  - term: AgentRunStatus
    definition: >
      Enum que representa el lifecycle completo de una ejecución (AgentRun): los estados por los
      que puede pasar, desde CREATED hasta un estado terminal (COMPLETED, FAILED, CANCELLED o
      EXPIRED).
    introduced_in: CH-01
    kind: contract
    ref: C-013

  - term: AgentLoop
    definition: >
      Componente que coordina el turn lifecycle de una ejecución cognitiva — decide si otro turno
      de razonamiento debe ocurrir y produce la transición de estado resultante — sin ejecutar
      directamente ningún side effect ni decidir autorización.
    introduced_in: CH-01
    kind: component
    ref: CMP-001

  - term: Turn
    definition: >
      Una iteración completa del ciclo model → action → observation dentro de un AgentRun: el
      modelo propone, AgentLoop decide si esa propuesta implica otro turno, una tool call o el fin
      de la ejecución.
    introduced_in: CH-01
    kind: concept

  - term: Agent Run
    definition: >
      Una ejecución concreta de un agente (identificada por RunId), cuyo progreso se representa en
      AgentState y cuyo lifecycle completo describe AgentRunStatus.
    introduced_in: CH-01
    kind: concept

  - term: Decision Ownership
    definition: >
      Principio (Article IV de la Constitution) por el cual cada decisión arquitectónica tiene un
      dueño único y nombrado — p. ej. AgentLoop decide "¿debe ocurrir otro turno?", nunca "¿puede
      el run continuar operacionalmente?" (ExecutionController) ni "¿está permitida esta acción?"
      (PolicyEngine).
    introduced_in: CH-01
    kind: concept

  - term: ToolRuntime
    definition: >
      Componente que resuelve la capability solicitada por un ToolCall, valida su input contra el
      schema declarado, ejecuta los hooks de extensión beforeToolCall/afterToolCall y coordina la
      ejecución de la acción aprobada, devolviendo un ToolResult normalizado — sin decidir
      autorización, aprobación humana, enforcement de presupuesto ni qué implementación satisface
      la capability.
    introduced_in: CH-02
    kind: component
    ref: CMP-002

  - term: Tool Call
    definition: >
      La intención, ya resuelta, de invocar una capability con un input concreto — contrato
      canónico ToolCall, citado por nombre en INV-04/INV-05 desde la primera versión de la
      Constitution, formalizado como contrato registrado en CH-02.
    introduced_in: CH-02
    kind: contract
    ref: C-008

  - term: Tool Result
    definition: >
      El resultado normalizado de ejecutar un ToolCall — éxito u error, nunca una excepción cruda
      — contrato canónico ToolResult, citado por nombre en INV-07, formalizado como contrato
      registrado en CH-02.
    introduced_in: CH-02
    kind: contract
    ref: C-009

  - term: Capability
    definition: >
      Abstracción (Article III) que desacopla la intención de una acción, nombrada en un ToolCall,
      de la implementación concreta que la satisface. Su registro y resolución real pertenecen a
      CapabilityRegistry (preview, no introducido todavía).
    introduced_in: CH-02
    kind: concept

  - term: Extension Point
    definition: >
      Punto definido del ciclo de ejecución (beforeToolCall/afterToolCall) donde un hook puede
      intervenir (P-12) — modelado como invocación directa, sin un registro de hooks con contrato
      propio todavía.
    introduced_in: CH-02
    kind: concept

  - term: ModelGateway
    definition: >
      Componente que selecciona el provider de modelo correspondiente, adapta los AgentMessage de
      un turno hacia el ModelRequest que ese provider espera, invoca al modelo y normaliza su
      respuesta cruda hacia un ModelResponse — sin decidir si otro turno debe ocurrir, sin
      ejecutar tool calls y sin resolver ninguna propuesta de acción hacia un ToolCall validado.
    introduced_in: CH-03
    kind: component
    ref: CMP-003

  - term: Model Request
    definition: >
      La forma empaquetada e independiente de proveedor que transporta los AgentMessage de un
      turno más los límites de generación relevantes (ExecutionBudget) — contrato canónico
      ModelRequest, formalizado como contrato registrado en CH-03, sobre uno de los tres ids que
      CH-01 dejó reservados.
    introduced_in: CH-03
    kind: contract
    ref: C-006

  - term: Model Response
    definition: >
      El resultado normalizado de invocar al modelo — texto final o una propuesta cruda de tool
      call — contrato canónico ModelResponse, formalizado como contrato registrado en CH-03, sobre
      uno de los tres ids que CH-01 dejó reservados.
    introduced_in: CH-03
    kind: contract
    ref: C-007

  - term: Raw Tool Call Proposal
    definition: >
      La forma en la que ModelResponse representa que el modelo propuso usar una herramienta —
      nombre de capacidad y argumentos, sin resolver ni validar — para no invadir la
      responsabilidad de resolución/validación que Article III asigna a ToolRuntime y
      CapabilityRegistry. Modelada como RawToolCallProposal, un STRUCT embebido dentro de
      ModelResponse sin contrato C-XXX propio.
    introduced_in: CH-03
    kind: concept

  - term: Provider Adapter
    definition: >
      La pieza (preview conceptual, no implementada todavía) que traduciría un ModelRequest hacia
      el payload específico de un proveedor concreto (OpenAI, Anthropic, Gemini, un modelo local) y
      su respuesta de vuelta hacia un ModelResponse — la materialización concreta de P-02 ("the
      model is replaceable").
    introduced_in: CH-03
    kind: concept

  - term: ContextEngine
    definition: >
      Componente que selecciona, rankea, compone y compacta el material candidato de un turno
      dentro de un presupuesto de contexto explícito, devolviendo un ContextSnapshot que registra
      la procedencia de cada bloque incluido — sin invocar al modelo, sin decidir continuación del
      turno, sin persistir historial de sesión y sin autorizar qué información puede verse.
    introduced_in: CH-04
    kind: component
    ref: CMP-004

  - term: Context Snapshot
    definition: >
      El resultado ya seleccionado, priorizado y compactado que ContextEngine produce a partir del
      material candidato de un turno — contrato canónico ContextSnapshot, formalizado en CH-04,
      sobre el último id que CH-01 dejó reservado.
    introduced_in: CH-04
    kind: contract
    ref: C-005

  - term: Context Block
    definition: >
      El fragmento individual de contexto que ContextEngine decide incluir en un ContextSnapshot,
      junto con su provenance y si tuvo que compactarse. Modelado como ContextBlock, un STRUCT
      embebido dentro de ContextSnapshot sin contrato C-XXX propio.
    introduced_in: CH-04
    kind: concept

  - term: Provenance
    definition: >
      El registro de dónde vino un fragmento de contexto incluido en un ContextSnapshot —
      responsabilidad que Article III asigna literalmente a ContextEngine, sin la cual ningún
      componente futuro podría auditar después por qué el modelo supo algo.
    introduced_in: CH-04
    kind: concept

  - term: Context Budget
    definition: >
      El límite explícito contra el cual ContextEngine valida su selección de contexto —
      reutiliza ExecutionBudget.maxInputTokens (C-012) en vez de introducir un tipo de presupuesto
      nuevo; ContextSnapshot.estimatedTokens registra cuánto de ese presupuesto consumió una
      selección concreta.
    introduced_in: CH-04
    kind: concept

  - term: PolicyEngine
    definition: >
      Componente que evalúa si una acción ya resuelta (ToolCall) puede ocurrir, produciendo una
      PolicyDecision de tres resultados posibles — allow, deny o require_approval — con la regla
      aplicable y el ToolCall evaluado siempre trazables, y que deniega por defecto (fail-closed)
      cuando ninguna policy rule le aplica — sin ejecutar la acción, sin invocar al modelo, sin
      seleccionar contexto, sin decidir continuación del turno y sin resolver ella misma la
      aprobación humana que puede exigir.
    introduced_in: CH-05
    kind: component
    ref: CMP-005

  - term: Policy Decision
    definition: >
      El resultado normalizado de que PolicyEngine evalúe un ToolCall — un outcome de tres
      estados (allow/deny/require_approval, nunca un Boolean), la policy rule que lo motivó y,
      cuando el resultado es deny, un HarnessError (categoría POLICY) explicando por qué —
      contrato canónico PolicyDecision, formalizado en CH-05 sobre C-014, el primer id
      verdaderamente nuevo del libro (no reservado desde CH-01).
    introduced_in: CH-05
    kind: contract
    ref: C-014

  - term: Policy Evaluation
    definition: >
      El tramo determinístico, exigido por INV-06 y P-05, en el que PolicyEngine decide si una
      acción ya resuelta puede ocurrir — antes de que ToolRuntime (CH-02) llegue a coordinar su
      ejecución. Nunca depende del modelo como fuente de autorización (P-13).
    introduced_in: CH-05
    kind: concept

  - term: Approval Requirement
    definition: >
      El tercer resultado posible de una PolicyDecision (require_approval), distinto de allow y
      de deny: la acción no está prohibida, pero tampoco puede ejecutarse todavía — necesita que
      un humano la resuelva primero (INV-15). PolicyEngine solo puede expresar este resultado;
      resolverlo pertenece a HumanInteractionService (preview, no introducido en este capítulo).
    introduced_in: CH-05
    kind: concept

  - term: Default Deny
    definition: >
      La regla de diseño (fail-closed) por la cual PolicyEngine responde con outcome = deny
      cuando ninguna policy rule conocida aplica a un ToolCall, en vez de permitir la acción por
      defecto o lanzar una excepción sin clasificar — la ausencia de una regla aplicable nunca se
      interpreta como autorización implícita.
    introduced_in: CH-05
    kind: concept

  - term: HumanInteractionService
    definition: >
      Componente que representa una solicitud de intervención humana a partir de una
      PolicyDecision con outcome = require_approval, la persiste mientras está pendiente, recibe
      su resolución y deja disponible la información que permitiría reanudar la ejecución — sin
      decidir si esa aprobación se requiere, sin transportar la interacción por ningún canal
      concreto, sin ejecutar la acción una vez resuelta y sin decidir si el turno debe continuar.
    introduced_in: CH-06
    kind: component
    ref: CMP-006

  - term: Human Interaction Request
    definition: >
      La solicitud persistida de una intervención humana pendiente — tipo (approval/input/review/
      decision), referencia al ToolCall que la motivó (reutilizando la correlación de
      PolicyDecision.callId) y estado (pendiente/resuelta) — contrato canónico
      HumanInteractionRequest, formalizado en CH-06, deliberadamente sin ningún campo de canal
      (INV-14).
    introduced_in: CH-06
    kind: contract
    ref: C-015

  - term: Human Interaction Resolution
    definition: >
      El resultado que un humano produjo al resolver una HumanInteractionRequest — un outcome de
      tres estados (aprobado/rechazado/valor provisto, nunca un Boolean), el valor provisto cuando
      aplica, y quién resolvió (para INV-19) — contrato canónico HumanInteractionResolution,
      formalizado en CH-06, lo que hace posible el paso "Resolution → Resume" de Article VIII.
    introduced_in: CH-06
    kind: contract
    ref: C-016

  - term: Channel Adapter
    definition: >
      La pieza (concepto de infraestructura de borde, no un componente de Article III) que
      transportaría una HumanInteractionRequest hacia un canal concreto (TUI, Web, Slack, Teams,
      Mobile, Email, API — Article VIII) y traería de vuelta la respuesta cruda del humano. Nunca
      decide el significado de esa respuesta (Human Interaction Rule); ese significado lo define y
      persiste el runtime, no la interfaz (P-11).
    introduced_in: CH-06
    kind: concept

  - term: Human-in-the-loop
    definition: >
      La capacidad general del runtime de pausar una ejecución para que un humano intervenga antes
      de continuar — Article VIII la declara explícitamente como "una capacidad del runtime, no de
      la TUI"; HumanInteractionService (CH-06) es su primera materialización real en este libro.
    introduced_in: CH-06
    kind: concept

  - term: ExecutionController
    definition: >
      Componente que evalúa si un AgentRun puede continuar operacionalmente contra su
      ExecutionBudget — turnos, tool calls, tokens, costo, runtime y concurrencia — o si fue
      cancelado explícitamente, produciendo una ExecutionDecision de tres resultados posibles
      (continue/stop/cancelled) con el uso actual siempre trazable — sin decidir si otro turno de
      razonamiento cognitivo debe ocurrir, sin ejecutar tools, sin evaluar policy y sin invocar al
      modelo. Le da, por primera vez, cumplimiento real a ExecutionBudget (C-012), citado desde
      CH-00 sin que ningún componente lo exigiera hasta este capítulo.
    introduced_in: CH-07
    kind: component
    ref: CMP-007

  - term: Execution Decision
    definition: >
      El resultado normalizado de que ExecutionController evalúe si un AgentRun puede continuar —
      un outcome de tres estados (continue/stop/cancelled, nunca un Boolean), la razón estructurada
      cuando se detiene por presupuesto, un HarnessError trazable (categoría BUDGET o
      CANCELLATION) y el uso actual contra el que se evaluó — contrato canónico ExecutionDecision,
      formalizado en CH-07 sobre C-017, el cuarto id verdaderamente nuevo del libro (no reservado
      desde CH-01).
    introduced_in: CH-07
    kind: contract
    ref: C-017

  - term: Operational Continuation
    definition: >
      La pregunta "¿puede el run continuar operacionalmente?" (Article IV) — distinta de la
      continuación cognitiva que AgentLoop posee ("¿debe ocurrir otro turno de razonamiento?"):
      operational continuation mira los límites del ExecutionBudget y la cancelación explícita,
      nunca si el modelo terminó de razonar. Responsabilidad exclusiva de ExecutionController.
    introduced_in: CH-07
    kind: concept

  - term: Execution Usage
    definition: >
      El uso actual de un AgentRun contra las dimensiones de su ExecutionBudget que AgentState no
      trackea (tool calls, tokens de entrada y salida, costo, runtime transcurrido y concurrencia
      de tools en vuelo — AgentState solo trackea currentTurn). Modelado como ExecutionUsage, un
      STRUCT embebido dentro de ExecutionDecision sin contrato C-XXX propio — el mismo patrón que
      RawToolCallProposal (CH-03) o ContextBlock (CH-04).
    introduced_in: CH-07
    kind: concept

  - term: Default Stop (Fail-Safe de Ejecución)
    definition: >
      La regla de diseño por la cual evaluateExecutionContinuation detiene la ejecución
      (outcome = STOP o CANCELLED) en cuanto cualquier dimensión del ExecutionBudget se excede o
      se solicitó cancelación explícita — nunca permite continuar "por si acaso" ni delega esa
      decisión al modelo (Article IX, Budget Rule: "el modelo nunca es la única autoridad para
      determinar cuándo debe detenerse una ejecución").
    introduced_in: CH-07
    kind: concept

  - term: CapabilityRegistry
    definition: >
      Componente que registra las capabilities disponibles junto con su descriptor (nombre
      canónico, versión, schema de entrada esperado y una referencia opaca a su implementación
      concreta), resuelve el capabilityName de una RawToolCallProposal contra ese registro, valida
      sus rawArguments contra el schema declarado y produce un ToolCall resuelto — sin ejecutar la
      capability, sin invocar al modelo, sin evaluar policy/autorización y sin decidir continuación
      de turno. Responde, por primera vez con código real, la pregunta de Article IV: "What
      implementation satisfies a requested capability?".
    introduced_in: CH-08
    kind: component
    ref: CMP-008

  - term: Capability Descriptor
    definition: >
      El descriptor registrado de una capability — su nombre canónico, una versión explícita
      (P-26), el schema de entrada contra el que se validan sus argumentos y una referencia opaca a
      su implementación concreta — contrato canónico CapabilityDescriptor, formalizado en CH-08
      sobre C-018, el quinto id verdaderamente nuevo del libro (no reservado desde CH-01).
    introduced_in: CH-08
    kind: contract
    ref: C-018

  - term: Capability Resolution
    definition: >
      El tramo determinístico, exigido por Article VI ("Resolve Capability" → "Validate Schema"),
      en el que se compara el capabilityName de una RawToolCallProposal contra un registro real de
      CapabilityDescriptor y se valida rawArguments contra la forma de entrada que esa capacidad
      declara — nunca una decisión de autorización: una resolución exitosa significa solo que la
      capacidad existe y sus argumentos son válidos, no que su ejecución esté permitida.
    introduced_in: CH-08
    kind: concept

  - term: Capability Versioning
    definition: >
      La exigencia (P-26, Amendment v1.1 — "Capabilities have governed lifecycles") de que una
      capability declare una versión explícita, en vez de depender de que su nombre por sí solo
      identifique de forma estable qué implementación exacta responde. CapabilityDescriptor.version
      adopta esta exigencia como base mínima, sin implementar todavía compatibility policy,
      rollout, deprecation ni retirement.
    introduced_in: CH-08
    kind: concept

  - term: EventBus
    definition: >
      Componente que registra la suscripción de un consumidor desacoplado (una referencia opaca más
      un filtro opcional por eventType/runId), permite su cancelación y distribuye (fan-out) cada
      AgentEvent ya producido por cualquier otro componente hacia las suscripciones activas que
      hagan match — sin decidir qué información contiene ese evento, sin interpretarlo ni actuar
      sobre él, sin persistir historial de sesión de forma durable y sin decidir continuación de
      turno. Es el primer componente real del libro sin fila propia en la tabla de Decision
      Ownership de Article IV, porque no decide nada, solo distribuye.
    introduced_in: CH-09
    kind: component
    ref: CMP-009

  - term: Event Subscription
    definition: >
      El registro de la relación entre un consumidor desacoplado (subscriberRef, opaco por diseño)
      y los AgentEvent que le interesan (un filtro opcional por eventType/runId), junto con su
      estado (activa/cancelada) — contrato canónico EventSubscription, formalizado en CH-09 sobre
      C-019, el sexto id verdaderamente nuevo del libro (no reservado desde CH-01).
    introduced_in: CH-09
    kind: contract
    ref: C-019

  - term: Fan-out
    definition: >
      El mecanismo por el cual un único AgentEvent ya producido se entrega, sin modificarse, a cada
      EventSubscription activa cuyo filtro haga match — responsabilidad exclusiva de EventBus
      (Article III: "distribuir eventos del runtime a consumidores desacoplados").
    introduced_in: CH-09
    kind: concept

  - term: Subscriber / Decoupled Consumer
    definition: >
      Quien se suscribe a la distribución de eventos del runtime, representado únicamente por una
      referencia opaca (EventSubscription.subscriberRef) — nunca modelado en detalle. Logs,
      Tracing, Audit, Replay, Analytics, Evals, Cost Analysis, Debugging y UI (Article X) son
      consumidores conceptuales de este tipo, ninguno todavía un componente propio del registry.
    introduced_in: CH-09
    kind: concept

  - term: Event Filter
    definition: >
      El criterio opcional, embebido dentro de una EventSubscription, que decide si un AgentEvent
      concreto hace match con esa suscripción — por eventType y/o runId. Su ausencia (filter =
      NULL) significa "todo tipo de evento, de cualquier ejecución". Modelado como EventFilter, un
      STRUCT embebido sin contrato C-XXX propio — el mismo patrón que RawToolCallProposal (CH-03) o
      ExecutionUsage (CH-07).
    introduced_in: CH-09
    kind: concept

  - term: SessionManager
    definition: >
      Componente que persiste y actualiza la historia de una sesión mediante checkpoints construidos
      a partir de un AgentState ya producido por una ejecución existente, reconstruye un SessionState
      completo desde un checkpoint ya persistido, y crea una rama nueva de sesión a partir de un
      checkpoint existente — sin poseer el estado operativo de la ejecución en curso, sin persistir
      las solicitudes de interacción humana que HumanInteractionService ya persiste por su cuenta,
      sin decidir continuación de turno y sin distribuir eventos. Responde, por primera vez con
      código real, la pregunta de Article IV: "What execution history and checkpoints persist?".
    introduced_in: CH-10
    kind: component
    ref: CMP-010

  - term: SessionState
    definition: >
      La historia persistida de una sesión — qué RunId le pertenecen, desde qué SessionCheckpoint
      puede reconstruirse, y su linaje opcional de ramificación — contrato canónico SessionState,
      formalizado en CH-10 sobre C-020, el nombre que P-08/INV-12 ya usaban desde la primera versión
      de la Constitution adoptada por este libro, sin contrato registrado hasta este capítulo. Nunca
      sustituye a AgentState (C-003) como fuente de verdad de una ejecución en curso — INV-12 exige
      que ambos permanezcan conceptualmente independientes.
    introduced_in: CH-10
    kind: contract
    ref: C-020

  - term: Session
    definition: >
      La historia continua de un agente, que puede abarcar múltiples AgentRun a lo largo del tiempo
      — ya nombrada desde CH-00 (SessionId, embebido en AgentState/ExecutionContext), pero sin que
      ningún contrato representara, hasta CH-10, su historia persistida como un todo distinto de
      cualquier ejecución individual.
    introduced_in: CH-10
    kind: concept

  - term: Checkpoint
    definition: >
      El punto persistido desde el cual una sesión puede reconstruirse — modelado como
      SessionCheckpoint, un STRUCT embebido dentro de SessionState sin contrato C-XXX propio (mismo
      patrón que ContextBlock, CH-04, o ExecutionUsage, CH-07). Cada checkpoint embebe una copia
      inmutable de un AgentState ya producido, nunca una referencia mutable a la ejecución activa.
    introduced_in: CH-10
    kind: concept

  - term: Branching
    definition: >
      La capacidad de que una sesión retome su historia desde un checkpoint que no es,
      necesariamente, el último de su propia línea — abriendo una nueva rama en vez de continuar
      linealmente. Modelada mediante SessionState.parentCheckpointId (Optional): NULL cuando no hubo
      ninguna ramificación, poblado con el id del checkpoint de origen cuando sí la hubo.
    introduced_in: CH-10
    kind: concept

  - term: Session Reconstruction
    definition: >
      El tramo determinístico, exigido literalmente por INV-13, en el que se reconstruye un
      SessionState completo a partir, exclusivamente, de un SessionCheckpoint ya persistido — sin
      necesitar ningún proceso en memoria que hubiera sobrevivido desde que ese checkpoint se creó.
    introduced_in: CH-10
    kind: concept

  - term: AgentCore
    definition: >
      Componente que representa la identidad de un agente — independiente de cualquier run o
      sesión particular —, valida su AgentConfig antes de que arranque cualquier ejecución, e
      instancia el AgentState inicial de un nuevo run: asigna su runId, decide su sessionId y
      produce la primera transición formal de Article V (CREATED → INITIALIZING) — sin poseer UI,
      persistencia específica, proveedores, business integrations, ni decidir continuación de
      turno una vez que el run ya está RUNNING. Undécimo y último componente de Article III; como
      EventBus (CH-09), sin fila propia en la tabla de Decision Ownership de Article IV, por una
      razón distinta: su decisión ocurre antes de que exista ningún AgentRun.
    introduced_in: CH-11
    kind: component
    ref: CMP-011

  - term: AgentActivationRequest
    definition: >
      La solicitud de activar un run de un agente ya configurado — agentId, un sessionId opcional
      (NULL si es una sesión nueva), el input/objetivo inicial y cuándo se solicitó — contrato
      canónico AgentActivationRequest, formalizado en CH-11 sobre C-021, el octavo id
      verdaderamente nuevo del libro. Deliberadamente distinto de ActivationRequest (Amendment
      v1.1, P-16), que normaliza un estímulo externo crudo antes de que exista un agentId
      resuelto — ver Ingress Activation.
    introduced_in: CH-11
    kind: contract
    ref: C-021

  - term: Agent Identity
    definition: >
      Lo que un agente es, independientemente de cualquier run o sesión particular — la
      referencia estable (AgentId) y la configuración declarativa (AgentConfig) que lo describen
      antes de que exista ninguna ejecución concreta. Una tercera capa, conceptualmente anterior a
      AgentState (el presente operativo de UNA ejecución) y a SessionState (la historia persistida
      de UNA sesión), que AgentCore es el primer componente en validar con código real.
    introduced_in: CH-11
    kind: concept

  - term: Agent Activation
    definition: >
      El acto de admitir que un agente configurado (AgentConfig ya existente y válido) empiece a
      existir como una ejecución concreta — produciendo el primer AgentState de un nuevo runId,
      con status = CREATED. Nunca decide si esa ejecución debe continuar después de arrancar; eso
      pertenece, desde CH-01, a AgentLoop.
    introduced_in: CH-11
    kind: concept

  - term: Agent Initialization
    definition: >
      La transición formal CREATED → INITIALIZING del diagrama de Article V — el instante en el
      que un run, ya activado, empieza a prepararse para correr (construyendo su primer
      ExecutionContext real) sin que todavía se haya invocado ningún turno de razonamiento.
      Documentada en prosa desde CH-01 §12; ejercitada con pseudocódigo real por primera vez en
      CH-11.
    introduced_in: CH-11
    kind: concept

  - term: Ingress Activation
    definition: >
      El concepto de Amendment v1.1 (P-16/P-17): normalizar un estímulo externo (un prompt, un
      webhook, una cola, un evento de otro sistema) hacia un ActivationRequest, evaluado por un
      AdmissionController (identidad, autorización, tenant, capacidad, rate, presupuesto,
      deduplicación, policy) antes de que exista siquiera un agentId resuelto — Ingress &
      Activation Plane, Enterprise, fuera de alcance de BH-v0.1. Deliberadamente distinto de Agent
      Activation (CH-11), que parte de un agentId ya conocido y ya configurado.
    introduced_in: CH-11
    kind: concept

  - term: AdmissionController
    definition: >
      Componente que aplica identity, authorization, tenant, capacity, rate, budget, deduplication
      y policy decisions sobre un ActivationRequest ya normalizado, antes de que cualquier ruteo
      hacia un agente concreto sea posible — produciendo un AdmissionDecision de dos resultados
      (ADMIT/REJECT, nunca un Boolean) — sin resolver ni rutear hacia un AgentId concreto, sin
      construir ningún AgentState y sin evaluar policy sobre ninguna acción ya resuelta. Primer
      componente de este registry que no corresponde a ninguno de los once nombres de Article III
      — pertenece al "Ingress & Activation Plane" de Amendment v1.1.
    introduced_in: CH-14
    kind: component
    ref: CMP-012

  - term: ActivationRequest
    definition: >
      El estímulo externo ya normalizado por un ingress adapter — de dónde vino (una referencia
      opaca al canal), qué identidad externa lo reclama (todavía sin autorizar), qué se pide y
      cuándo llegó — sin ningún agentId resuelto todavía. Contrato canónico ActivationRequest,
      formalizado en CH-14 sobre C-022, el noveno id verdaderamente nuevo del libro. Deliberadamente
      distinto de AgentActivationRequest (C-021, CH-11), que parte siempre de un agentId ya
      conocido y ya registrado.
    introduced_in: CH-14
    kind: contract
    ref: C-022

  - term: AdmissionDecision
    definition: >
      El resultado normalizado de que AdmissionController evalúe un ActivationRequest — un outcome
      de dos estados (ADMIT/REJECT, nunca un Boolean), la razón estructurada cuando se rechaza y la
      correlación de vuelta con el ActivationRequest evaluado (nunca un AgentId resuelto) —
      contrato canónico AdmissionDecision, formalizado en CH-14 sobre C-023, el décimo id
      verdaderamente nuevo del libro.
    introduced_in: CH-14
    kind: contract
    ref: C-023

  - term: Admission
    definition: >
      La decisión de si un ActivationRequest ya normalizado puede proceder — evaluando identidad,
      autorización, tenant, capacidad, rate, presupuesto, deduplicación y policy (Amendment v1.1,
      P-17) — antes de que exista cualquier ruteo hacia un agente concreto o cualquier intento de
      activación real. Responsabilidad exclusiva de AdmissionController; distinta de Policy
      Evaluation (CH-05), que decide sobre una acción ya resuelta dentro de un run ya en curso.
    introduced_in: CH-14
    kind: concept

  - term: Ingress Adapter
    definition: >
      La pieza de infraestructura de borde (un webhook handler, un consumidor de cola, un
      disparador de cron, un endpoint de API) que normaliza un estímulo externo crudo hacia un
      ActivationRequest, per Amendment v1.1 P-16 ("ingress mechanisms — not AgentLoop concerns").
      Nunca un componente propio de este registry — mismo tratamiento que Channel Adapter (CH-06).
    introduced_in: CH-14
    kind: concept

  - term: Routing (Amendment v1.1)
    definition: >
      La decisión, todavía sin componente propio en este registry, de a qué AgentId/AgentConfig
      concreto corresponde un ActivationRequest ya admitido. P-17 la coloca explícitamente después
      de la admisión ("...decisions before routing"); AdmissionController nunca la resuelve.
    introduced_in: CH-14
    kind: concept

  - term: AgentCommunicationGateway
    definition: >
      Componente que adapta mensajes semánticos hacia/desde protocolos de interoperabilidad
      externos (A2A u otros) exclusivamente a través de adapters, desacoplando el core de cualquier
      SDK, protocolo o transporte concreto, y verifica — sin redefinirlo — que una comunicación
      respaldada por un DelegationGrant respete su scope, su vencimiento y el ExecutionBudget
      acotado que ese grant declara — sin decidir si el estímulo que originó cualquiera de los dos
      runs comunicándose tenía derecho a arrancar, sin autorizar ninguna acción ya resuelta y sin
      decidir continuación de turno. Segundo componente de este registry que no corresponde a
      ninguno de los once nombres de Article III — pertenece al "Agent Interoperability Plane" de
      Amendment v1.1.
    introduced_in: CH-15
    kind: component
    ref: CMP-013

  - term: AgentCommunicationMessage
    definition: >
      El contrato semántico explícito que cruza una frontera de comunicación entre agentes —
      de qué agente viene, hacia qué agente va, si esa frontera es interna (delegación) o externa
      (federación), su contenido semántico, la referencia opcional al DelegationGrant que lo
      respalda, y su traceId — deliberadamente sin ningún campo de protocolo o transporte (P-18,
      INV-E04). Contrato canónico AgentCommunicationMessage, formalizado en CH-15 sobre C-024, el
      undécimo id verdaderamente nuevo del libro.
    introduced_in: CH-15
    kind: contract
    ref: C-024

  - term: DelegationGrant
    definition: >
      El token de autoridad delegada, explícito y acotado, que un run transfiere hacia un agente
      hijo o remoto — quién delega, a quién, con qué scope explícito (nunca "todo"), con qué
      ExecutionBudget acotado (reutilizado, sin modificar, INV-E06) y hasta cuándo — satisfaciendo,
      literalmente, las tres propiedades que P-21 exige: scoped, time-bounded y auditable. Contrato
      canónico DelegationGrant, formalizado en CH-15 sobre C-025, el duodécimo id verdaderamente
      nuevo del libro.
    introduced_in: CH-15
    kind: contract
    ref: C-025

  - term: AgentCommunication Boundary
    definition: >
      La frontera explícita que todo mensaje agente-a-agente debe cruzar (INV-E03, cita literal
      "AgentCommunication boundary") — nunca una invocación directa de un agente hacia la
      implementación de otro. Modelada como AgentCommunicationMessage.boundary
      (AgentCommunicationBoundary: INTERNAL/EXTERNAL).
    introduced_in: CH-15
    kind: concept

  - term: Internal Delegation
    definition: >
      Comunicación hacia un sub-agente gestionado por el mismo runtime — P-20 permite que use un
      protocolo interno. Modelada como AgentCommunicationMessage.boundary = INTERNAL; puede o no
      llevar un DelegationGrant, según si representa una transferencia real de autoridad.
    introduced_in: CH-15
    kind: concept

  - term: External Federation
    definition: >
      Comunicación con un agente operado independientemente, fuera de este sistema — P-20
      recomienda un boundary basado en estándares (A2A u otros) para este caso. Modelada como
      AgentCommunicationMessage.boundary = EXTERNAL.
    introduced_in: CH-15
    kind: concept

  - term: A2A (Agent-to-Agent)
    definition: >
      El estándar de interoperabilidad que P-19/INV-E05 citan por nombre como una opción externa
      de federación — nunca una dependencia del core. Se enseña exclusivamente como el protocolo
      que un Protocol Adapter futuro (Preview, no introducido) implementaría detrás de
      AgentCommunicationGateway; ningún STRUCT/ENUM/FUNCTION de este libro lo modela como tipo o
      dependencia real.
    introduced_in: CH-15
    kind: concept

  - term: Federation Boundary
    definition: >
      El límite de confianza que separa a este sistema de un agente operado por un tercero
      independiente — la razón por la cual External Federation debería apoyarse en un estándar
      público como A2A en vez de un protocolo interno propietario (P-20).
    introduced_in: CH-15
    kind: concept

  - term: Delegated Authority
    definition: >
      La autoridad, siempre acotada, que un DelegationGrant transfiere de un run hacia un agente
      hijo o remoto — nunca la autoridad completa de quien delega (P-21: "MUST NOT automatically
      inherit the caller's authority").
    introduced_in: CH-15
    kind: concept

  - term: Protocol Adapter
    definition: >
      La pieza de infraestructura de borde (no modelada en detalle, no un componente de este
      registry) que traduciría un AgentCommunicationMessage semántico hacia el formato concreto de
      un estándar de interoperabilidad (A2A u otro) y de vuelta — mismo tratamiento que Provider
      Adapter (CH-03) para el lado del modelo.
    introduced_in: CH-15
    kind: concept

  - term: Transport Adapter
    definition: >
      La pieza de infraestructura de borde (distinta de Protocol Adapter, no modelada, no un
      componente de este registry) que entregaría físicamente un mensaje ya adaptado a un
      protocolo — HTTP, gRPC, WebSocket, SSE, una cola, un Service Bus. INV-E04 exige que Protocol
      Adapter y Transport Adapter sean reemplazables de forma independiente entre sí.
    introduced_in: CH-15
    kind: concept

  - term: CredentialBroker
    definition: >
      Componente (CMP-014) del "Capability & Integration Plane" de Amendment v1.1 que resuelve, para
      una implementación de capability ya resuelta (CapabilityDescriptor, C-018), la credencial que
      necesita para autenticarse contra el sistema externo real que envuelve — produciendo
      exclusivamente una CredentialReference opaca, nunca el valor real del secreto (cita literal,
      INV-E08), y aplicando sobre ese secreto el gobierno de datos que P-22 exige (clasificación,
      rotación/expiración).
    introduced_in: CH-16
    kind: component
    ref: CMP-014

  - term: CredentialReference
    definition: >
      Contrato (C-026) que representa la referencia opaca al secreto que una implementación de
      capability ya resuelta necesita — nunca el valor real del secreto en sí. Correlaciona con el
      CapabilityDescriptor al que pertenece (capability: CapabilityId), declara un nombre lógico
      (credentialName), una clasificación (CredentialClassification, P-22) y, opcionalmente, un
      vencimiento (expiresAt).
    introduced_in: CH-16
    kind: contract
    ref: C-026

  - term: Secret
    definition: >
      El valor sensible real (una API key, un token, una contraseña) que autentica una
      implementación de capability contra el sistema externo que envuelve. Este libro nunca modela
      ese valor como un contrato — no existe, ni existirá, ningún STRUCT cuyo campo lo contenga; se
      representa exclusivamente mediante una CredentialReference opaca (C-026, CH-16).
    introduced_in: CH-16
    kind: concept

  - term: Credential Classification
    definition: >
      La materialización literal, con código real, de la exigencia de clasificación de P-22
      aplicada específicamente a un secreto — modelada como CredentialReference.classification:
      CredentialClassification (CONFIDENTIAL/RESTRICTED). Un ENUM de dos valores, deliberadamente no
      un Boolean, porque no todos los secretos cargan el mismo riesgo.
    introduced_in: CH-16
    kind: concept

  - term: Credential Rotation
    definition: >
      Lectura de P-22 ("retention") aplicada específicamente a un secreto: el vencimiento explícito
      de una CredentialReference, más allá del cual CredentialBroker rechaza por defecto — modelado
      de forma mínima como CredentialReference.expiresAt: Optional<Timestamp>. El mecanismo real que
      rota un secreto detrás de esa fecha no se modela en este libro (Preview).
    introduced_in: CH-16
    kind: concept

  - term: Secret Store
    definition: >
      La pieza de infraestructura de borde (vault, secret manager, KMS — no modelada, no un
      componente de este registry) que almacenaría el valor crudo de un secreto detrás de
      CredentialBroker — mismo tratamiento que Protocol Adapter/Transport Adapter (CH-15) o Ingress
      Adapter (CH-14): nombrada, nunca modelada en detalle.
    introduced_in: CH-16
    kind: concept

  - term: Tenant Isolation of Credentials
    definition: >
      Lectura de INV-E07 ("Tenant data, memory, credentials, artifacts and audit records are
      isolated") aplicada a credenciales: la exigencia de que las credenciales de un tenant nunca
      sean visibles ni resolubles por otro. Citada literalmente en CH-16 como parte del owns de
      CredentialBroker, sin que su mecanismo de enforcement se modele todavía.
    introduced_in: CH-16
    kind: concept

  - term: IdempotencyGuard
    definition: >
      Componente (CMP-015) del "Reliability Plane" de Amendment v1.1 que rastrea, para un ToolCall
      con side effects (C-008) identificado por una clave de idempotencia ya asumida como dada, si
      esa ejecución ya ocurrió antes — permitiendo reusar el ToolResult (C-009) ya producido en vez
      de duplicar el side effect real, y registrando de forma terminal y write-once una ejecución
      nueva ya concluida. Cierra INV-11 (Article II, declarado desde CH-00, nunca antes resuelto) y
      materializa, con código real, P-24/INV-E09 (Amendment v1.1). A diferencia de CredentialBroker/
      AdmissionController/AgentCommunicationGateway, ningún texto de la Constitution nombra
      literalmente este componente — es una síntesis de este libro.
    introduced_in: CH-17
    kind: component
    ref: CMP-015

  - term: IdempotencyRecord
    definition: >
      Contrato (C-027) que representa el registro persistido de una clave de idempotencia ya
      vista: la clave misma (idempotencyKey), una referencia opaca a la capability a la que
      pertenece, una referencia al ToolCall original, un estado (IdempotencyRecordStatus:
      PENDING/COMPLETED, nunca un Boolean) y, cuando ya terminó, el ToolResult reusable.
    introduced_in: CH-17
    kind: contract
    ref: C-027

  - term: Idempotency Key
    definition: >
      El identificador, provisto por quien origina la intención lógica de un ToolCall con side
      effects, que correlaciona dos o más intentos de esa misma intención entre sí. Quién la
      genera, y con qué algoritmo, queda fuera de alcance de CH-17 — se asume como dada, igual que
      otros capítulos asumen señales de entrada.
    introduced_in: CH-17
    kind: concept

  - term: Deduplication
    definition: >
      Lectura de INV-11 ("deduplicación"): el acto de reconocer que un intento de ejecución
      corresponde a una intención lógica ya vista, y decidir reusar el resultado ya producido en
      vez de repetir el side effect real. Modelado por IdempotencyGuard (CMP-015, CH-17) mediante
      checkIdempotency/recordIdempotentExecution.
    introduced_in: CH-17
    kind: concept

  - term: Duplicate Delivery
    definition: >
      Cita literal de INV-E09/P-24 ("duplicate-delivery"): el escenario en el que la misma petición
      lógica se entrega más de una vez por una causa externa al harness (un reintento de red, una
      cola de mensajes at-least-once, un cliente que reenvía tras no recibir respuesta a tiempo).
      IdempotencyGuard (CH-17) no elimina la entrega duplicada en sí — hace que esa duplicidad deje
      de traducirse en un side effect duplicado.
    introduced_in: CH-17
    kind: concept

  - term: Concurrent Execution Guard
    definition: >
      La exigencia de que una segunda ejecución concurrente bajo la misma idempotencyKey, mientras
      la primera todavía está en curso, espere en vez de duplicar el side effect — modelada de
      forma mínima mediante IdempotencyRecordStatus.PENDING (CH-17). El mecanismo real que hace
      esperar a esa segunda ejecución (colas, locks, polling) es Preview, no modelado por CH-17.
    introduced_in: CH-17
    kind: concept

  - term: OperationalController
    definition: >
      Componente (CMP-016) del "Control Plane" de Amendment v1.1 que emite y aplica un
      ControlDirective — deshabilitar una capability, aislar los runs de un tenant, revertir un
      rollout o forzar, mediante un kill switch, la terminación inmediata de un AgentRun — actuando
      siempre desde AFUERA del ciclo de cualquier run particular, sin depender de la cooperación
      del modelo ni de AgentLoop (cita literal, P-30/INV-E14). A diferencia de CredentialBroker/
      AdmissionController/AgentCommunicationGateway, y de la misma forma que IdempotencyGuard,
      ningún texto de la Constitution nombra literalmente este componente — es una síntesis de
      este libro. Es el primer componente distinto de AgentLoop cuyo pseudocódigo produce, de
      verdad, una transición de AgentRunStatus.
    introduced_in: CH-18
    kind: component
    ref: CMP-016

  - term: ControlDirective
    definition: >
      Contrato (C-028) que representa el comando operacional emitido desde afuera de cualquier
      AgentRun particular: qué tipo de acción (ControlDirectiveType: DISABLE_CAPABILITY/
      ISOLATE_TENANT/ROLLBACK/KILL_SWITCH, cita literal de P-30), a qué alcance opaco aplica
      (targetRef), quién lo emitió (issuedBy: ActorId, reusado de CH-06) y si ya se propagó con
      efecto real (status: ControlDirectiveStatus, ISSUED/APPLIED, nunca un Boolean).
    introduced_in: CH-18
    kind: contract
    ref: C-028

  - term: Kill Switch
    definition: >
      Cita literal de P-30/INV-E14: el mecanismo más inmediato de control operacional — forzar la
      terminación de un AgentRun específico, de inmediato, sin pasar por su ciclo cooperativo.
      Modelado como ControlDirective.type = KILL_SWITCH; applyControlDirective (CH-18) lo aplica
      forzando AgentState.status = CANCELLED directamente, sin invocar
      ExecutionController.evaluateExecutionContinuation (CH-07) ni ningún turno de AgentLoop
      (CH-01) — la primera vía no cooperativa hacia AgentRunStatus.CANCELLED que este libro cablea
      con código real.
    introduced_in: CH-18
    kind: concept

  - term: Capability Disablement
    definition: >
      Lectura de P-30: deshabilitar una capability ya registrada (CapabilityDescriptor, C-018,
      CH-08) de modo que ningún ToolCall pueda resolverse contra ella mientras esté deshabilitada.
      Modelado como ControlDirective.type = DISABLE_CAPABILITY; el mecanismo real de enforcement
      dentro de CapabilityRegistry.resolveToolCall es Preview, no modelado por CH-18.
    introduced_in: CH-18
    kind: concept

  - term: Tenant Isolation
    definition: >
      Lectura de P-30, distinta de INV-E07 ("Tenant data, memory, credentials, artifacts and audit
      records are isolated", ya citada por CredentialBroker, CH-16): detener o bloquear TODOS los
      runs de un tenant de una sola vez, en vez de aislar sus datos entre tenants. Modelado como
      ControlDirective.type = ISOLATE_TENANT; el mecanismo real y distribuido que efectivamente
      bloquea esos runs es Preview, no modelado por CH-18.
    introduced_in: CH-18
    kind: concept

  - term: Rollout Rollback
    definition: >
      Lectura de P-30, reusa el versionado de P-26/CapabilityDescriptor.version (C-018, CH-08) ya
      existente en vez de introducir un sistema de versiones nuevo: revertir una capability
      desplegada hacia una versión anterior ya conocida. Modelado como ControlDirective.type =
      ROLLBACK, con targetRef refiriendo la versión objetivo.
    introduced_in: CH-18
    kind: concept

  - term: Operational Override
    definition: >
      La propiedad, exigida por P-30, de que un ControlDirective tenga efecto incluso cuando el
      proceso o ciclo objetivo no coopera. El eje que distingue a OperationalController (CH-18) de
      cualquier componente anterior a CH-18, cuya eficacia dependía siempre de que algo dentro del
      propio ciclo del run invocara su función en el momento correcto.
    introduced_in: CH-18
    kind: concept

  - term: AuditLedger
    definition: >
      Componente (CMP-017) que produce y preserva, de forma estructuralmente inmutable, evidencia
      de auditoría (AuditRecord, C-029) para una decisión crítica ya tomada por otro componente —
      cita literal, P-25 ("Logs, traces, execution ledger and immutable audit evidence have
      different purposes and MUST NOT be conflated"). Nunca toma ni modifica la decisión que
      audita, y nunca distribuye el flujo general de eventos operacionales del harness (frontera
      con EventBus, CMP-009, CH-09). Sexto componente de este libro sin fila propia en la tabla de
      Decision Ownership de Article IV — junto a EventBus, registrar no es decidir.
    introduced_in: CH-19
    kind: component
    ref: CMP-017

  - term: AuditRecord
    definition: >
      Contrato (C-029) que representa el registro de evidencia de auditoría estructuralmente
      inmutable: una referencia opaca a la decisión original ya auditada (subjectRef), el snapshot
      exacto de versiones que INV-E10 exige (versionSnapshot), el actor y el contexto (INV-19), un
      timestamp (recordedAt) y una garantía de integridad verificable (contentHash). Primer
      contrato de este libro sin ningún campo de estado/lifecycle y sin ninguna función de
      actualización o borrado — inmutabilidad estructural, no una convención documentada.
    introduced_in: CH-19
    kind: contract
    ref: C-029

  - term: Immutable Audit Evidence
    definition: >
      Cita literal de P-25: la propiedad que distingue a un AuditRecord (C-029) de un AgentEvent
      (C-010) distribuido por EventBus (CH-09) — logs, traces y el flujo operacional pueden
      filtrarse, reinterpretarse o perderse por volumen; la evidencia de auditoría, una vez
      escrita, nunca se edita ni se borra. Citada sin resolverse desde CH-09 (donde "Audit" ya se
      nombra como uno de los nueve consumidores de Article X) y repetida, sin resolverse, en
      CH-14/CH-15/CH-16/CH-17/CH-18 — AuditLedger (CH-19) es el primer componente de este libro que
      la materializa con código real.
    introduced_in: CH-19
    kind: concept

  - term: Version Pinning
    definition: >
      Lectura de INV-E10 ("Every production run records exact versions of agent, skill, policy,
      model configuration and capability contracts"): fijar, en el instante exacto de una decisión
      crítica, las versiones exactas de los cinco elementos que esa decisión involucró — para que,
      si cualquiera de ellos cambia después, alguien pueda reconstruir sin ambigüedad contra qué
      versión exacta se decidió. Modelado como VersionSnapshot, embebido dentro de AuditRecord
      (C-029, CH-19) sin contrato C-XXX propio — mismo patrón que ExecutionUsage (CH-07) o
      ControlDirectiveApplication (CH-18).
    introduced_in: CH-19
    kind: concept

  - term: DataGovernanceEngine
    definition: >
      Componente (CMP-018) que clasifica cualquier dato que fluye por el sistema (un ContextBlock
      de CH-04, un ToolResult de CH-02) con un nivel de sensibilidad, un requisito de residencia,
      una fecha límite de retención, una bandera de legal-hold y una referencia de lineage — cita
      literal, P-22 ("Classification, residency, retention, lineage... and legal-hold requirements
      MUST be enforceable independently of model reasoning"). Nunca decide qué contexto es
      relevante (frontera con ContextEngine, CMP-004, CH-04) ni reclasifica un secreto ya
      clasificado por CredentialBroker (CMP-014, CH-16). Séptimo componente de este libro que no
      corresponde a ninguno de los once nombres de Article III.
    introduced_in: CH-20
    kind: component
    ref: CMP-018

  - term: DataGovernanceLabel
    definition: >
      Contrato (C-030) que representa la etiqueta de gobernanza portátil de un dato: una
      referencia opaca al dato gobernado (subjectRef), un nivel de clasificación de cuatro valores
      (classification: DataClassificationLevel), un requisito de residencia opaco
      (residencyRequirement), una fecha límite de retención (retentionDeadline), una bandera de
      legal-hold que suspende cualquier borrado programado sin borrar el plazo original
      (legalHold), una referencia de lineage opaca (lineageRef) y un timestamp (classifiedAt).
      Diseñada, per INV-E11, para viajar junto con el dato a través de fronteras de componentes.
    introduced_in: CH-20
    kind: contract
    ref: C-030

  - term: Data Classification
    definition: >
      Cita literal de P-22 ("Classification... MUST be enforceable independently of model
      reasoning"): el nivel de sensibilidad asignado a un dato concreto. Modelado como
      DataClassificationLevel (ENUM de cuatro valores: PUBLIC/INTERNAL/CONFIDENTIAL/RESTRICTED,
      CH-20) — nunca un Boolean "es sensible o no", y distinto del esquema más estrecho de dos
      valores (CredentialClassification, C-026, CH-16) exclusivo de secretos.
    introduced_in: CH-20
    kind: concept

  - term: Data Residency
    definition: >
      Lectura de P-22 ("residency"): el requisito de que un dato deba procesarse o almacenarse
      dentro de una región o jurisdicción concreta. Modelado como
      DataGovernanceLabel.residencyRequirement (Optional<Text>, CH-20), una referencia opaca cuyo
      significado exacto es una señal de entrada asumida, no modelada por ese capítulo.
    introduced_in: CH-20
    kind: concept

  - term: Legal Hold
    definition: >
      Cita literal de P-22 ("legal-hold requirements MUST be enforceable independently of model
      reasoning"): la bandera que, cuando está activa, suspende cualquier borrado programado sobre
      un dato — independientemente de si su retentionDeadline ya se cumplió. Modelada como
      DataGovernanceLabel.legalHold (Boolean, CH-20); enforceRetention evalúa esta bandera ANTES de
      comparar retentionDeadline, y nunca borra ni reemplaza ese plazo original al aplicar la
      suspensión — la interacción central que CH-20 documenta con cuidado.
    introduced_in: CH-20
    kind: concept
